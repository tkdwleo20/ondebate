<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전체 게시글 관리 — OnDebate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>:root{--ink:#222;--line:#e5e5e5;--paper:#f6f6f6;--red:#d85a50}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 980px)/2));gap:42px}.brand{color:#222;text-decoration:none;font-size:22px;font-weight:700;letter-spacing:-1.3px}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px}nav a{color:#666;font-size:14px;text-decoration:none}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer}main{width:min(980px,calc(100% - 36px));margin:28px auto 70px}h1{margin:0 0 7px;font-size:22px}.intro{margin:0 0 18px;color:#777;font-size:13px}.section{background:#fff;border:1px solid var(--line)}.item{padding:17px 18px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.title{color:#222;text-decoration:none;font-size:15px;font-weight:700}.meta{margin-top:7px;color:#777;font-size:12px;line-height:1.65}.status{display:inline-block;margin-right:7px;font-weight:700}.status.hidden{color:#a34840}.status.ended{color:#777}.status.active,.status.waiting{color:#b5443c}.actions{display:flex;gap:7px;margin-top:12px}.actions a,.actions button{border:1px solid #cfcfcf;background:#fff;padding:7px 10px;color:#555;font:12px "Noto Sans KR",sans-serif;cursor:pointer;text-decoration:none}.actions .delete{border-color:#9b302a;background:#9b302a;color:#fff}.empty{margin:0;padding:20px;color:#888;font-size:13px}@media(max-width:650px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px}nav{margin-left:17px;gap:16px}nav a{font-size:12px}.start{display:none}#auth-area{margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 28px);margin-top:22px}}</style>
</head>
<body>
<header>
<a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i>
</a>
<nav>
<a href="index.html#popular">인기 토론</a>
<a href="index.html#categories">카테고리</a>
</nav>
<a class="start" href="login.html?next=create-debate.html">토론 시작하기</a>
<span id="auth-area">
</span>
</header>
<main>
<h1>전체 게시글 관리</h1>
<p class="intro">신고 여부와 관계없이 모든 토론을 조회하고 영구 삭제할 수 있습니다.</p>
<section class="section" id="posts">
<p class="empty">게시글을 불러오는 중입니다.</p>
</section>
</main>
<script type="module">import{supabase,mountAuthState}from'./supabase.js?v=notification-titles-2';const{data:{user}}=await supabase.auth.getUser();if(!user)location.href='login.html?next=admin-posts.html';mountAuthState('auth-area');const list=document.getElementById('posts');const{data:posts,error}=await supabase.rpc('admin_debates');if(error){list.innerHTML='<p class="empty">관리자 권한이 없거나 게시글을 불러오지 못했습니다.</p>'}else if(!posts?.length){list.innerHTML='<p class="empty">등록된 게시글이 없습니다.</p>'}else{list.replaceChildren();const labels={waiting:'상대 모집 중',active:'진행 중',ended:'종료됨',hidden:'숨김'};posts.forEach(post=>{const item=document.createElement('article');item.className='item';const title=document.createElement('a');title.className='title';title.href=`debate-detail.html?id=${post.id}`;title.textContent=post.title;const meta=document.createElement('div');meta.className='meta';const status=document.createElement('span');status.className=`status ${post.status}`;status.textContent=labels[post.status]||post.status;meta.append(status,document.createTextNode(`${post.category} · ${post.creator_nickname} vs ${post.opponent_nickname} · 발언 ${post.messages_count} · 댓글 ${post.comments_count} · 투표 ${post.votes_count}`));const actions=document.createElement('div');actions.className='actions';const view=document.createElement('a');view.href=`debate-detail.html?id=${post.id}`;view.textContent='게시글 보기';
const visibility=document.createElement('button');visibility.type='button';const isHidden=post.status==='hidden';
visibility.textContent=isHidden?'✓ 숨김 처리됨':'게시물 숨김';if(isHidden){visibility.style.cssText='border-color:#666;background:#666;color:#fff;font-weight:700';visibility.title='클릭하여 숨김 해제'}visibility.addEventListener('click',async()=>{if(!confirm(isHidden?'이 게시물의 숨김을 해제할까요?':'이 게시물을 숨김 처리할까요?'))return;visibility.disabled=true;const{error}=await supabase.rpc('admin_set_debate_visibility',{p_debate_id:post.id,p_hidden:!isHidden});if(error){alert(error.message);visibility.disabled=false;return}location.reload()});const remove=document.createElement('button');remove.type='button';remove.className='delete';remove.textContent='게시글 삭제';remove.addEventListener('click',async()=>{if(!confirm(`「${post.title}」 토론과 모든 발언·댓글·투표를 영구 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`))return;remove.disabled=true;const{error}=await supabase.rpc('admin_delete_debate',{p_debate_id:post.id});if(error){alert(error.message);remove.disabled=false;return}item.remove()});actions.append(view,visibility,remove);item.append(title,meta,actions);list.append(item)})}</script>
</body>
</html>
