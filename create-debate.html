<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>토론 시작하기 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --muted:#777; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; }
      * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; } button,input,select,textarea { font:inherit; }
      header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 980px)/2)); gap:42px; } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; } nav { display:flex; gap:26px; } nav a { color:#666; font-size:14px; text-decoration:none; } nav a.active { color:#222; font-weight:700; } .account-button { margin-left:auto; border:0; background:transparent; color:#555; font:13px "Noto Sans KR",sans-serif; cursor:pointer; padding:8px 4px; white-space:nowrap; }
      main { width:min(860px,calc(100% - 36px)); margin:24px auto 70px; }
      .form-card { background:#fff; border:1px solid var(--line); } .field { padding:21px 22px; border-bottom:1px solid var(--line); } .field:last-of-type { border-bottom:0; } label { display:block; font-weight:700; font-size:14px; margin-bottom:9px; } .required { color:var(--red); margin-left:3px; } .hint { margin:0 0 10px; color:#888; font-size:12px; line-height:1.55; }
      input[type="text"], select, textarea { display:block; width:100%; border:1px solid #d7d7d7; border-radius:2px; color:#222; padding:10px 11px; outline:none; font-size:14px; } input[type="text"] { height:42px; } textarea { min-height:180px; resize:vertical; line-height:1.7; } input:focus, select:focus, textarea:focus { border-color:#555; } select { height:42px; background:#fff; }
      .time-row { display:flex; align-items:center; gap:11px; } .time-row input { width:96px; height:42px; border:1px solid #d7d7d7; padding:0 10px; } .time-row span { font-size:13px; } .time-preview { margin-top:9px; color:#777; font-size:12px; } .agreement { background:#fafafa; border-top:1px solid var(--line); padding:15px 22px; color:#666; font-size:12px; line-height:1.6; }
      .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; } .cancel, .submit { height:42px; padding:0 17px; font-size:13px; cursor:pointer; } .cancel { border:1px solid #cfcfcf; background:#fff; color:#555; } .submit { border:1px solid #333; background:#333; color:#fff; font-weight:600; } .success { display:none; margin-top:15px; padding:13px 15px; background:#eef7ee; border:1px solid #cbe2cc; color:#39623c; font-size:13px; } .success.show { display:block; }
      @media(max-width:650px) { header { padding:0 18px; gap:20px; } nav { gap:15px; } nav a:last-child { display:none; } main { margin-top:24px; } .field { padding:18px 15px; } .time-row { flex-wrap:wrap; } .time-preview { width:100%; margin-left:0; } }
    </style>
  </head>
  <body>
    <header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a href="index.html">홈</a><a href="#">인기 토론</a><a href="#">카테고리</a></nav><span id="auth-area"></span></header>
    <main>
      <form id="debate-form" class="form-card">
        <div class="field"><input id="title" type="text" maxlength="100" required placeholder="제목을 입력해주세요" aria-label="토론 주제" /></div>
        <div class="field"><label for="category">카테고리<span class="required">*</span></label><select id="category" required><option value="" selected disabled>카테고리를 선택하세요</option><option>사회 · 정치</option><option>문화 · 엔터</option><option>연애 · 인간관계</option><option>게임 · 스포츠</option><option>일상 · 자유</option></select></div>
        <div class="field"><label for="duration">토론 시간<span class="required">*</span></label><p class="hint">토론은 시작 후 정해진 시간에 자동 종료됩니다. 1시간에서 24시간 사이로 설정해 주세요.</p><div class="time-row"><input id="duration" type="number" min="1" max="24" value="12" required /><span>시간</span></div><div class="time-preview">종료 예정: <b id="end-time">계산 중</b></div></div>
        <div class="field"><label for="opening">첫 발언<span class="required">*</span></label><textarea id="opening" required maxlength="3000" placeholder="본인의 주장을 적어주세요"></textarea></div>
        <div class="agreement">등록 후에는 토론 시간을 변경할 수 없습니다. 욕설, 혐오 표현, 개인정보 노출 등 운영 원칙에 어긋나는 내용은 신고 및 삭제될 수 있습니다.</div>
      </form>
      <div class="actions"><a class="cancel" href="index.html" style="text-decoration:none;display:grid;place-items:center">취소</a><button class="submit" form="debate-form" type="submit">토론 시작하기</button></div>
      <div class="success" id="success">토론을 만들었습니다. 상세 화면으로 이동합니다.</div>
    </main>
    <script type="module">
      import { supabase, ensureProfile, mountAuthState } from './supabase.js';
      mountAuthState('auth-area');
      const duration = document.getElementById('duration'); const endTime = document.getElementById('end-time');
      function updateEndTime() { const hours = Math.min(24, Math.max(1, Number(duration.value) || 1)); duration.value = hours; const date = new Date(Date.now() + hours * 60 * 60 * 1000); endTime.textContent = date.toLocaleString('ko-KR', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
      duration.addEventListener('input', updateEndTime); updateEndTime();
      document.getElementById('debate-form').addEventListener('submit', event => {
        event.preventDefault();
        const debate = { title: document.getElementById('title').value.trim(), category: document.getElementById('category').value, duration: Number(duration.value), opening: document.getElementById('opening').value.trim() };
        if (!debate.title || !debate.category || !debate.opening) return;
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { location.href = 'login.html?next=create-debate.html'; return; }
        try {
          await ensureProfile();
          const { data: debateId, error } = await supabase.rpc('create_debate', { p_title: debate.title, p_category: debate.category, p_duration_hours: debate.duration, p_opening: debate.opening });
          if (error) throw error;
          document.getElementById('success').textContent = '토론을 만들었습니다. 상세 화면으로 이동합니다.';
          document.getElementById('success').classList.add('show');
          window.setTimeout(() => { location.href = `debate-detail.html?id=${debateId}`; }, 600);
        } catch (error) {
          document.getElementById('success').textContent = `저장하지 못했습니다: ${error.message}`;
          document.getElementById('success').classList.add('show');
        }
      });
    </script>
  </body>
</html>
