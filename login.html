<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); font-family:"Noto Sans KR",sans-serif; color:var(--ink); }
      header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 980px)/2)); } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; }
      main { min-height:calc(100vh - 62px); display:grid; place-items:center; padding:30px 18px; } .card { width:min(400px,100%); background:#fff; border:1px solid var(--line); padding:30px; text-align:center; } h1 { font-size:21px; letter-spacing:-.8px; margin:0 0 9px; } p { color:#777; font-size:13px; line-height:1.65; margin:0 0 24px; } .login { width:100%; height:46px; border:1px solid #ddd; background:#fff; margin:5px 0; font-size:14px; font-weight:600; cursor:pointer; border-radius:3px; } .login:hover { background:#fafafa; } .google::before { content:'G'; display:inline-grid; place-items:center; width:20px; height:20px; margin-right:9px; color:#4285f4; font-weight:800; } .divider { display:flex; align-items:center; gap:10px; color:#aaa; font-size:11px; margin:18px 0 13px; } .divider::before,.divider::after { content:''; height:1px; background:#e7e7e7; flex:1; } .email-form { text-align:left; } .email-form label { display:block; margin:10px 0 6px; font-size:12px; font-weight:700; } .email-form input { width:100%; height:43px; border:1px solid #d7d7d7; padding:0 10px; font:13px "Noto Sans KR",sans-serif; } .email-submit { width:100%; height:45px; margin-top:15px; border:0; background:#333; color:#fff; font-size:13px; font-weight:700; cursor:pointer; } .email-submit:disabled { background:#999; cursor:wait; } .signup-link { display:block; margin-top:17px; color:#666; font-size:12px; } .signup-link a { color:#333; font-weight:700; } .status { display:none; color:#c34d41; font-size:12px; margin-top:16px; text-align:left; } .status.show { display:block; } .fine { color:#999; font-size:11px; margin-top:23px; }
    </style>
  </head>
  <body>
    <header><a class="brand" href="index.html">On<i>Debate</i></a></header>
    <main><section class="card"><h1>OnDebate 로그인</h1><p>로그인 후 토론을 시작하고<br />댓글과 투표에 참여할 수 있습니다.</p><button class="login google" id="google">Google로 계속하기</button><div class="divider">또는 이메일로 로그인</div><form class="email-form" id="email-login"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com" /><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="비밀번호 입력" /><button class="email-submit" type="submit">이메일로 로그인</button></form><div class="signup-link">처음 방문하셨나요? <a href="signup.html">이메일로 회원가입</a></div><div class="status" id="status"></div><div class="fine">로그인하면 OnDebate의 운영 원칙에 동의하게 됩니다.</div></section></main>
    <script type="module">
      import { supabase } from './supabase.js';
      const { data: { user } } = await supabase.auth.getUser();
      if (user) location.href = new URLSearchParams(location.search).get('next') || 'index.html';
      const status = document.getElementById('status');
      async function signIn(provider) {
        const next = new URLSearchParams(location.search).get('next') || 'index.html';
        const { error } = await supabase.auth.signInWithOAuth({ provider, options: { redirectTo: new URL(next, location.href).href } });
        if (error) { status.textContent = `로그인 연결을 시작하지 못했습니다: ${error.message}`; status.classList.add('show'); }
      }
      document.getElementById('google').addEventListener('click', () => signIn('google'));
      document.getElementById('email-login').addEventListener('submit', async event => {
        event.preventDefault(); const button = event.currentTarget.querySelector('button');
        button.disabled = true; button.textContent = '로그인 중…'; status.classList.remove('show');
        const { error } = await supabase.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value });
        if (error) { status.textContent = '이메일 또는 비밀번호를 확인해 주세요.'; status.classList.add('show'); button.disabled = false; button.textContent = '이메일로 로그인'; return; }
        location.href = new URLSearchParams(location.search).get('next') || 'index.html';
      });
    </script>
  </body>
</html>
