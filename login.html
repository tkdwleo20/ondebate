<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); font-family:"Noto Sans KR",sans-serif; color:var(--ink); }
      header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 980px)/2)); } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; }
      main { min-height:calc(100vh - 62px); display:grid; place-items:center; padding:30px 18px; } .card { width:min(400px,100%); background:#fff; border:1px solid var(--line); padding:30px; text-align:center; } h1 { font-size:21px; letter-spacing:-.8px; margin:0 0 9px; } p { color:#777; font-size:13px; line-height:1.65; margin:0 0 24px; } .login { width:100%; height:46px; border:1px solid #ddd; background:#fff; margin:5px 0; font-size:14px; font-weight:600; cursor:pointer; border-radius:3px; } .login:hover { background:#fafafa; } .login:disabled { cursor:wait; opacity:.65; } .google::before { content:'G'; display:inline-grid; place-items:center; width:20px; height:20px; margin-right:9px; color:#4285f4; font-weight:800; } .kakao { background:#fee500; border-color:#fee500; color:#191919; } .kakao:hover { background:#f5db00; } .kakao::before { content:'●'; margin-right:9px; font-size:12px; } .divider { display:flex; align-items:center; gap:10px; margin:17px 0 13px; color:#aaa; font-size:11px; } .divider::before,.divider::after { content:''; flex:1; height:1px; background:#e5e5e5; } .email-form { display:grid; gap:8px; } .email-form input { width:100%; height:43px; border:1px solid #d9d9d9; padding:0 11px; font:13px "Noto Sans KR",sans-serif; } .login-options { display:flex; align-items:center; gap:15px; padding:3px 0 1px; text-align:left; color:#777; font-size:12px; } .login-options label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; } .login-options input { width:14px; height:14px; margin:0; accent-color:#444; } .email-form button { width:100%; height:45px; border:0; background:#333; color:#fff; font:700 13px "Noto Sans KR",sans-serif; cursor:pointer; } .email-form button:disabled { opacity:.65; cursor:wait; } .signup-link { display:block; margin-top:14px; color:#666; font-size:12px; } .signup-link a { color:#333; font-weight:700; } .status { display:none; color:#c34d41; font-size:12px; margin-top:16px; text-align:left; } .status.show { display:block; } .fine { color:#999; font-size:11px; margin-top:23px; }
    </style>
  </head>
  <body>
    <header><a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i></a></header>
    <main><section class="card"><h1>OnDebate 로그인</h1><p>로그인 후 토론을 시작하고<br />댓글과 투표에 참여할 수 있습니다.</p><form class="email-form" id="email-login-form"><input id="email" type="email" autocomplete="email" required placeholder="이메일" /><input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호" /><div class="login-options"><label><input id="save-email" type="checkbox" />아이디 저장</label><label><input id="auto-login" type="checkbox" checked />자동 로그인</label></div><button type="submit">이메일로 로그인</button></form><span class="signup-link">이메일 계정이 없나요? <a id="signup-link" href="signup.html">회원가입</a></span><div class="divider">또는</div><button class="login google" id="google">Google로 계속하기</button><button class="login kakao" id="kakao">카카오로 계속하기</button><div class="status" id="status"></div><div class="fine">로그인하면 OnDebate의 운영 원칙에 동의하게 됩니다.</div></section></main>
    <script type="module">
      import { supabase } from './supabase.js?v=brand-logo-4';
      const { data: { user } } = await supabase.auth.getUser();
      if (user) location.href = new URLSearchParams(location.search).get('next') || 'index.html';
      const status = document.getElementById('status');
      async function signIn(provider) {
        const next = new URLSearchParams(location.search).get('next') || 'index.html';
        const { error } = await supabase.auth.signInWithOAuth({ provider, options: { redirectTo: new URL(next, location.href).href } });
        if (error) { status.textContent = `로그인 연결을 시작하지 못했습니다: ${error.message}`; status.classList.add('show'); }
      }
      document.getElementById('google').addEventListener('click', () => signIn('google'));
      document.getElementById('signup-link').href = `signup.html${location.search}`;
      const emailInput = document.getElementById('email'); const saveEmail = document.getElementById('save-email'); const autoLogin = document.getElementById('auto-login');
      const savedEmail = localStorage.getItem('ondebate-saved-email');
      if (savedEmail) { emailInput.value = savedEmail; saveEmail.checked = true; }
      autoLogin.checked = localStorage.getItem('ondebate-auto-login') !== 'false';
      document.getElementById('email-login-form').addEventListener('submit', async event => {
        event.preventDefault(); const button = event.currentTarget.querySelector('button'); const next = new URLSearchParams(location.search).get('next') || 'index.html';
        button.disabled = true; button.textContent = '로그인 중…'; status.classList.remove('show');
        const email = emailInput.value.trim();
        const { error } = await supabase.auth.signInWithPassword({ email, password: document.getElementById('password').value });
        if (error) { status.textContent = '이메일 또는 비밀번호를 확인해 주세요.'; status.classList.add('show'); button.disabled = false; button.textContent = '이메일로 로그인'; return; }
        if (saveEmail.checked) localStorage.setItem('ondebate-saved-email', email); else localStorage.removeItem('ondebate-saved-email');
        localStorage.setItem('ondebate-auto-login', String(autoLogin.checked));
        location.href = next;
      });
      document.getElementById('kakao').addEventListener('click', async event => {
        const button = event.currentTarget; const next = new URLSearchParams(location.search).get('next') || 'index.html';
        button.disabled = true; button.textContent = '카카오로 이동 중…'; status.classList.remove('show');
        try {
          const state = crypto.randomUUID(); const redirectUri = new URL('kakao-callback.html', location.href).href;
          sessionStorage.setItem('kakao-oauth-state', state); sessionStorage.setItem('kakao-next', next);
          const { data, error } = await supabase.functions.invoke('kakao-token', { body: { action:'start', state, redirectUri } });
          if (error) throw error;
          location.href = data.authorizeUrl;
        } catch (error) {
          status.textContent = '카카오 로그인 설정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'; status.classList.add('show'); button.disabled = false; button.textContent = '카카오로 계속하기';
        }
      });
    </script>
    <script src="footer.js"></script>
  </body>
</html>
