
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --muted:#777; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; } header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:42px; padding:0 max(28px,calc((100vw - 980px)/2)); } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; } nav { display:flex; gap:26px; } nav a { color:#666; font-size:14px; text-decoration:none; } nav a.active { color:#222; font-weight:700; } .start { margin-left:auto; background:#3b3b3b; color:#fff; text-decoration:none; border-radius:3px; padding:9px 14px; font-size:13px; font-weight:600; } #auth-area { display:flex; align-items:center; gap:10px; } .account-link { color:#333; text-decoration:none; font-size:13px; font-weight:600; } .logout-button { border:0; background:transparent; color:#888; font:13px "Noto Sans KR",sans-serif; cursor:pointer; padding:8px 0; } .mobile-nav,.mobile-start { display:none; }
      main { width:min(980px,calc(100% - 36px)); margin:28px auto 70px; } .page-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; } h1 { margin:0; font-size:22px; letter-spacing:-1px; } .page-logout { border:1px solid #d1d1d1; background:#fff; color:#555; padding:8px 11px; font:600 12px "Noto Sans KR",sans-serif; cursor:pointer; } .stats { display:grid; grid-template-columns:repeat(3,1fr); background:#fff; border:1px solid var(--line); margin-bottom:20px; } .stat { padding:20px; border-right:1px solid var(--line); } .stat:last-child { border:0; } .stat b { display:block; color:#777; font-size:12px; font-weight:500; margin-bottom:8px; } .stat strong { font-size:22px; letter-spacing:-1px; } .section { background:#fff; border:1px solid var(--line); margin-bottom:18px; } h2 { margin:0; padding:16px 18px; border-bottom:1px solid var(--line); font-size:16px; } .item { padding:15px 18px; border-bottom:1px solid var(--line); } .item:last-child { border:0; } .item a { color:#222; text-decoration:none; font-size:14px; font-weight:600; } .item span, .empty { display:block; color:#888; font-size:12px; margin-top:5px; } .empty { padding:18px; margin:0; }
      @media(max-width:650px) { header { height:58px; padding:0 14px; gap:0; } .brand { font-size:19px; } nav { margin-left:17px; gap:16px; } nav a { font-size:12px; text-align:center; line-height:1.15; } .desktop-nav { display:none; } .mobile-nav { display:inline; } .start { display:none; } #auth-area { margin-left:auto; min-width:0; } #auth-area .account-link { max-width:62px; overflow:hidden; text-overflow:ellipsis; font-size:12px; font-weight:800; } #auth-area .logout-button { display:none; } .mobile-start { display:flex; position:fixed; right:18px; bottom:20px; z-index:4; align-items:center; background:#303030; color:#fff; text-decoration:none; border-radius:24px; padding:13px 17px; box-shadow:0 5px 16px rgba(0,0,0,.22); font-size:13px; font-weight:700; } main { width:calc(100% - 28px); } .stats { grid-template-columns:1fr; } .stat { border-right:0; border-bottom:1px solid var(--line); } .stat:last-child { border-bottom:0; } }
    </style>
  </head>
  <body>
    <header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a href="index.html#popular"><span class="desktop-nav">인기 토론</span><span class="mobile-nav">인기 토론</span></a><a href="index.html#categories">카테고리</a></nav><a class="start" href="create-debate.html">토론 시작하기</a><span id="auth-area"></span></header>
    <main><div class="page-heading"><h1 id="page-title">마이페이지</h1><button class="page-logout" id="page-logout" type="button">로그아웃</button></div><section class="stats"><div class="stat"><b>토론 횟수</b><strong id="debate-count">0</strong></div><div class="stat"><b>승률</b><strong id="win-rate">-</strong></div><div class="stat"><b>포인트</b><strong id="points">0 P</strong></div></section><section class="section"><h2>작성한 토론</h2><div id="debates"><p class="empty">작성한 토론을 불러오는 중입니다.</p></div></section><section class="section"><h2>작성한 댓글</h2><div id="comments"><p class="empty">아직 작성한 댓글이 없습니다.</p></div></section></main>
    <a class="mobile-start" href="create-debate.html">＋ 토론 시작하기</a>
    <script type="module">
      import { supabase, getProfile, mountAuthState } from './supabase.js';
      const { data: { user } } = await supabase.auth.getUser(); if (!user) location.href = 'login.html?next=my.html';
      const profile = await getProfile(); if (!profile) location.href = 'nickname.html?next=my.html';
      document.getElementById('page-title').textContent = `${profile.nickname}님의 마이페이지`; document.getElementById('points').textContent = `${profile.points.toLocaleString()} P`; mountAuthState('auth-area'); document.getElementById('page-logout').addEventListener('click', async () => { await supabase.auth.signOut(); location.href = 'index.html'; });
      const { data: debates } = await supabase.from('debates').select('id,title,category,status,created_at').eq('creator_id', user.id).order('created_at', { ascending:false });
      document.getElementById('debate-count').textContent = debates?.length || 0;
      const list = document.getElementById('debates'); list.replaceChildren();
      if (!debates?.length) list.innerHTML = '<p class="empty">아직 작성한 토론이 없습니다.</p>';
      else debates.forEach(debate => { const item = document.createElement('div'); item.className = 'item'; const link = document.createElement('a'); link.href = `debate-detail.html?id=${debate.id}`; link.textContent = debate.title; const meta = document.createElement('span'); meta.textContent = `${debate.category} · ${debate.status === 'waiting' ? '상대 모집 중' : '진행 중'}`; item.append(link, meta); list.append(item); });
    </script>
  </body>
</html>
