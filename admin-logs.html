<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>운영로그 | OnDebate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#222;--line:#e5e5e5;--paper:#f6f6f6;--red:#d85a50;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 980px)/2));gap:42px}.brand{color:#222;text-decoration:none;font-size:22px;font-weight:700;letter-spacing:-1.3px}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px}nav a{color:#666;font-size:14px;text-decoration:none}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer}main{width:min(980px,calc(100% - 36px));margin:28px auto 70px}h1{margin:0 0 7px;font-size:22px}.intro{margin:0 0 18px;color:#777;font-size:13px;line-height:1.6}.section{background:#fff;border:1px solid var(--line);margin-bottom:18px}.section h2{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font-size:15px}.form{padding:16px 18px;display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:start}.form select,.form input,.form textarea{width:100%;border:1px solid #d6d6d6;background:#fff;padding:9px;font:13px "Noto Sans KR",sans-serif}.form textarea{grid-column:2/3;min-height:58px;resize:vertical}.form button{border:1px solid #444;background:#444;color:#fff;padding:9px 12px;font:600 12px "Noto Sans KR",sans-serif;cursor:pointer}.notice{padding:0 18px 15px;margin:0;color:#888;font-size:11px;line-height:1.6}.item{padding:15px 18px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.meta{color:#888;font-size:11px}.action{margin:6px 0;font-size:14px;font-weight:700}.detail{margin:0;color:#666;font-size:12px;line-height:1.6;white-space:pre-wrap}.tag{display:inline-block;margin-right:6px;padding:2px 6px;border:1px solid #ddd;background:#fafafa;color:#666;font-size:10px;font-weight:700}.empty{margin:0;padding:20px;color:#888;font-size:13px}.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fafafa;color:#666;padding:11px;font:600 12px "Noto Sans KR",sans-serif;cursor:pointer}@media(max-width:650px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px}nav{margin-left:17px;gap:16px}nav a{font-size:12px}.start{display:none}#auth-area{margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 28px);margin-top:22px}.form{grid-template-columns:1fr}.form textarea{grid-column:auto}.form button{width:max-content}}
  </style>
</head>
<body>
  <header><a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i></a><nav><a href="popular.html">인기 토론</a><a href="index.html?section=categories&amp;nav=1#categories">카테고리</a></nav><a class="start" href="create-debate.html">토론 시작하기</a><span id="auth-area"></span></header>
  <main>
    <h1>운영로그</h1><p class="intro">관리자 삭제·숨김·신고 처리와 운영 정책·제재 기준 변경 기록입니다. 기록은 수정하거나 삭제할 수 없습니다.</p>
    <section class="section"><h2>운영 정책·제재 기준 변경 기록</h2><form class="form" id="policy-form"><select id="policy-category" aria-label="변경 종류"><option>운영 정책</option><option>제재 기준</option></select><input id="policy-summary" maxlength="160" required placeholder="변경 요약" aria-label="변경 요약"><button>기록</button><textarea id="policy-detail" maxlength="1000" placeholder="상세 내용 (선택)" aria-label="상세 내용"></textarea></form><p class="notice">정책 문서나 제재 기준을 변경한 뒤, 변경 내용과 적용 이유를 남겨 주세요.</p></section>
    <section class="section"><h2>전체 기록</h2><div id="logs"><p class="empty">운영로그를 불러오는 중입니다.</p></div><button class="more" id="more" type="button" hidden>더 보기</button></section>
  </main>
  <script type="module">
    import {supabase,mountAuthState} from './supabase.js?v=operation-log-1';
    const list=document.getElementById('logs'),more=document.getElementById('more');let offset=0;const pageSize=50;
    const labels={debate_hidden:'게시물 숨김',debate_unhidden:'게시물 숨김 해제',debate_deleted:'게시물 삭제',report_processed:'신고 처리',policy_changed:'정책·제재 기준 변경'};
    const escape=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const time=v=>new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Seoul'}).format(new Date(v));
    function append(rows){if(!offset)list.replaceChildren();if(!rows.length&&!offset){list.innerHTML='<p class="empty">아직 기록이 없습니다.</p>';return}for(const row of rows){const el=document.createElement('article');el.className='item';const detail=row.details?.detail||row.details?.admin_note||'';el.innerHTML=`<div class="meta">${escape(time(row.created_at))} · ${escape(row.admin_nickname||'알 수 없음')}</div><p class="action"><span class="tag">${escape(labels[row.action_type]||row.action_type)}</span>${escape(row.target_label||row.reason||'')}</p>${row.reason&&row.target_label?`<p class="detail">${escape(row.reason)}</p>`:''}${detail?`<p class="detail">${escape(detail)}</p>`:''}`;list.append(el)}}
    async function load(){more.disabled=true;const {data,error}=await supabase.rpc('admin_operation_log_page',{p_limit:pageSize,p_offset:offset});if(error){list.innerHTML=`<p class="empty">운영로그를 불러오지 못했습니다: ${escape(error.message)}</p>`;return}append(data||[]);offset+=(data||[]).length;more.hidden=(data||[]).length<pageSize;more.disabled=false}
    document.getElementById('policy-form').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;const {error}=await supabase.rpc('admin_record_policy_change',{p_category:document.getElementById('policy-category').value,p_summary:document.getElementById('policy-summary').value.trim(),p_detail:document.getElementById('policy-detail').value.trim()||null});button.disabled=false;if(error){alert(error.message);return}e.currentTarget.reset();offset=0;await load()});more.addEventListener('click',load);
    const {data:{user}}=await supabase.auth.getUser();if(!user){location.href='login.html?next=admin-logs.html'}else{const {data:isAdmin}=await supabase.rpc('is_admin');if(!isAdmin){location.href='my.html'}else{mountAuthState('auth-area');load()}}
  </script>
</body></html>
