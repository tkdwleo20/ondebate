<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>인기 토론 — OnDebate</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><style>
:root{--ink:#222;--muted:#777;--line:#e5e5e5;--paper:#f6f6f6;--red:#e64b3c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1120px)/2));gap:42px;position:sticky;top:0;z-index:3}.brand{font:700 22px "Noto Sans KR",sans-serif;letter-spacing:-1.3px;text-decoration:none;color:var(--ink)}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px;height:100%;align-items:center}nav a{font-size:14px;text-decoration:none;color:#666;font-weight:500}nav a.active{color:var(--ink);font-weight:700}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer;padding:8px 0;white-space:nowrap}.mobile-nav{display:none}main{width:min(700px,calc(100% - 36px));margin:28px auto 70px}.search-area{background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:18px}.search-area h1{font-size:16px;margin:0 0 13px;letter-spacing:-.5px}.search-form{display:flex;height:43px}.search-form input{min-width:0;flex:1;border:2px solid #303030;border-right:0;padding:0 13px;font:14px "Noto Sans KR",sans-serif;outline:0}.search-form button{width:92px;border:0;background:#303030;color:#fff;font:600 13px "Noto Sans KR",sans-serif;cursor:pointer}.search-hints{margin-top:10px;color:#888;font-size:12px}.search-hints a{color:#777;text-decoration:none;margin-left:8px}.columns{display:grid;gap:18px}.section{background:#fff;border:1px solid var(--line)}h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:16px}.rank-item{display:block;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}.rank-item:last-child{border-bottom:0}.rank-item:hover{background:#fafafa}.rank-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.rank-number{width:18px;color:#b34b42;font-weight:800;font-size:13px}.badge{border-radius:4px;padding:3px 6px;font-size:10px;font-weight:800}.live{background:#fff0ec;color:#d9422e}.waiting{background:#edf3ff;color:#3970c9}.ended{background:#f0f0f0;color:#777}.votes{margin-left:auto;color:#777;font-size:11px}.rank-title{display:block;margin:8px 0 7px;font-size:15px;font-weight:600;letter-spacing:-.45px}.opening{display:block;color:#888;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{margin:0;padding:20px;color:#888;font-size:13px}@media(max-width:760px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px;letter-spacing:-1.1px}nav{margin-left:17px;gap:16px}nav a{font-size:12px;text-align:center;line-height:1.15;white-space:nowrap}.desktop-nav{display:none}.mobile-nav{display:inline}.start{display:none}#auth-area{display:flex;margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 28px);margin-top:18px}.search-area{padding:16px}.search-form button{width:64px;font-size:12px}.search-form input{padding:0 10px;font-size:12px}.rank-item{padding:15px 14px}}</style></head>
<body><header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a class="active" href="popular.html"><span class="desktop-nav">인기 토론</span><span class="mobile-nav">인기 토론</span></a><a href="index.html#categories">카테고리</a></nav><a class="start" href="login.html?next=create-debate.html">토론 시작하기</a><span id="auth-area"><a class="account-link" href="login.html">로그인</a></span></header><main><section class="search-area"><h1>토론 주제 검색</h1><form class="search-form" action="search.html" method="get"><input name="q" type="search" placeholder="궁금한 토론 주제를 검색하세요" aria-label="토론 주제 검색" required /><button type="submit">검색</button></form></section><div class="columns"><section class="section"><h2>일간 인기 토론</h2><div id="daily"><p class="empty">집계 중입니다.</p></div></section><section class="section"><h2>주간 인기 토론</h2><div id="weekly"><p class="empty">집계 중입니다.</p></div></section></div></main><script type="module">
import{supabase,mountAuthState}from'./supabase.js';mountAuthState('auth-area');async function render(targetId,hours){const target=document.getElementById(targetId);const{data:ranked,error}=await supabase.rpc('popular_debates',{p_hours:hours});if(error){target.innerHTML='<p class="empty">인기 토론을 불러오지 못했습니다.</p>';return}target.replaceChildren();if(!ranked?.length){target.innerHTML='<p class="empty">해당 기간의 투표 기록이 없습니다.</p>';return}ranked.forEach((debate,index)=>{const row=document.createElement('a');row.className='rank-item';row.href=`debate-detail.html?id=${debate.id}`;const meta=document.createElement('div');meta.className='rank-meta';const number=document.createElement('span');number.className='rank-number';number.textContent=index+1;const ended=new Date(debate.ends_at)<=new Date();const badge=document.createElement('span');badge.className=`badge ${ended?'ended':(debate.status==='waiting'?'waiting':'live')}`;badge.textContent=ended?'종료된 토론':(debate.status==='waiting'?'상대 모집 중':'진행 중');const category=document.createElement('span');category.textContent=debate.category;const votes=document.createElement('span');votes.className='votes';votes.textContent=`투표 ${debate.vote_count}`;meta.append(number,badge,category,votes);const title=document.createElement('strong');title.className='rank-title';title.textContent=debate.title;const note=document.createElement('span');note.className='opening';note.textContent=debate.opening_preview||'첫 발언을 불러올 수 없습니다.';row.append(meta,title,note);target.append(row)})}render('daily',24);render('weekly',168);
</script></body></html>
