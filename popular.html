<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>인기 토론 — OnDebate</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><style>:root{--ink:#222;--line:#e5e5e5;--paper:#f6f6f6;--red:#d85a50}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 980px)/2));gap:42px}.brand{color:#222;text-decoration:none;font-size:22px;font-weight:700;letter-spacing:-1.3px}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px}nav a{color:#666;font-size:14px;text-decoration:none}nav a.active{color:#222;font-weight:700}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer}main{width:min(700px,calc(100% - 36px));max-width:calc(100% - 28px);margin:28px auto 70px}.search-area{background:#fff;border:1px solid var(--line);padding:20px 18px;margin-bottom:18px}.search-area h1{margin:0 0 13px;font-size:16px;letter-spacing:-.5px}.search-form{display:flex;height:43px}.search-form input{min-width:0;flex:1;border:2px solid #303030;border-right:0;padding:0 13px;font:14px "Noto Sans KR",sans-serif;outline:0}.search-form button{width:92px;border:0;background:#303030;color:#fff;font:600 13px "Noto Sans KR",sans-serif;cursor:pointer}.search-hints{margin-top:10px;color:#888;font-size:12px}.search-hints a{color:#777;text-decoration:none;margin-left:8px}h1{margin:0 0 8px;font-size:22px;letter-spacing:-1px}.hero{background:#fff;border:1px solid var(--line);padding:20px 18px;margin-bottom:18px}.intro{margin:7px 0 0;color:#777;font-size:13px}.columns{display:grid;grid-template-columns:1fr;gap:18px;min-width:0}.section{min-width:0;background:#fff;border:1px solid var(--line)}h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:16px}.rank-item{min-width:0;display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);color:#222;text-decoration:none}.rank-item:last-child{border-bottom:0}.rank-number{width:18px;color:#b34b42;font-weight:800;font-size:15px}.rank-title{min-width:0;flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.votes{flex:none;color:#888;font-size:12px}.empty{margin:0;padding:20px;color:#888;font-size:13px}@media(max-width:650px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px}nav{margin-left:17px;gap:16px}nav a{font-size:12px}.start{display:none}#auth-area{margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 28px);max-width:calc(100% - 28px);margin-top:22px}.search-area{padding:16px}.search-form button{width:64px;font-size:12px}.search-form input{padding:0 10px;font-size:12px}.rank-item{padding:14px 13px;gap:9px}}</style></head><body><header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a class="active" href="popular.html">인기 토론</a><a href="index.html#categories">카테고리</a></nav><a class="start" href="login.html?next=create-debate.html">토론 시작하기</a><span id="auth-area"></span></header><main><section class="search-area"><h1>토론 주제 검색</h1><form class="search-form" action="search.html" method="get"><input name="q" type="search" placeholder="궁금한 토론 주제를 검색하세요" aria-label="토론 주제 검색" required /><button type="submit">검색</button></form><div class="search-hints">인기 검색어 <a href="search.html?q=%EC%97%B0%EC%95%A0">연애</a><a href="search.html?q=%EC%A0%95%EC%B9%98">정치</a><a href="search.html?q=%EA%B2%8C%EC%9E%84">게임</a><a href="search.html?q=%EC%A7%81%EC%9E%A5">직장</a></div></section><section class="hero"><h1>인기 토론</h1><p class="intro">관전자 투표 수를 기준으로 집계합니다.</p></section><div class="columns"><section class="section"><h2>일간 인기 토론</h2><div id="daily"><p class="empty">집계 중입니다.</p></div></section><section class="section"><h2>주간 인기 토론</h2><div id="weekly"><p class="empty">집계 중입니다.</p></div></section></div></main><script type="module">import{supabase,mountAuthState}from'./supabase.js';mountAuthState('auth-area');const now=Date.now(),dailySince=now-24*60*60*1000,weeklySince=now-7*24*60*60*1000;const{data:debates,error}=await supabase.from('debates').select('id,title,votes(created_at)').neq('status','hidden');function render(targetId,since){const target=document.getElementById(targetId);if(error){target.innerHTML='<p class="empty">인기 토론을 불러오지 못했습니다.</p>';return}const ranked=(debates||[]).map(debate=>({...debate,count:(debate.votes||[]).filter(vote=>new Date(vote.created_at).getTime()>=since).length})).filter(debate=>debate.count>0).sort((a,b)=>b.count-a.count||a.title.localeCompare(b.title,'ko')).slice(0,5);target.replaceChildren();if(!ranked.length){target.innerHTML='<p class="empty">해당 기간의 투표 기록이 없습니다.</p>';return}ranked.forEach((debate,index)=>{const row=document.createElement('a');row.className='rank-item';row.href=`debate-detail.html?id=${debate.id}`;const number=document.createElement('span');number.className='rank-number';number.textContent=index+1;const title=document.createElement('span');title.className='rank-title';title.textContent=debate.title;const votes=document.createElement('span');votes.className='votes';votes.textContent=`투표 ${debate.count}`;row.append(number,title,votes);target.append(row)})}render('daily',dailySince);render('weekly',weeklySince);</script></body></html>
