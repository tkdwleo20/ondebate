<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>성장 분석 | OnDebate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root{--red:#e6544b;--ink:#202020;--muted:#858585;--line:#e8e8e8;--bg:#f7f7f7}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",Arial,sans-serif} header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1120px)/2));gap:42px;position:sticky;top:0;z-index:3}.brand{color:#222;text-decoration:none;font:700 22px "Noto Sans KR",sans-serif;letter-spacing:-1.3px}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px;height:100%;align-items:center}nav a{color:#666;text-decoration:none;font-size:14px;font-weight:500}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px;min-width:0}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer;padding:8px 0;white-space:nowrap}
    main{width:min(1040px,calc(100% - 36px));margin:28px auto 70px}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.heading h1{margin:0;font-size:24px;letter-spacing:-1px}.heading p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.range{border:1px solid #d4d4d4;background:#fff;padding:8px 10px;color:#555;font:600 12px "Noto Sans KR",sans-serif}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:#fff;margin-bottom:18px}.card{padding:17px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.card:nth-child(3n){border-right:0}.card:nth-last-child(-n+3){border-bottom:0}.card b{display:block;color:#777;font-size:12px;font-weight:500}.card strong{display:inline-block;margin-top:8px;font-size:23px;letter-spacing:-1px}.change{margin-left:7px;font-size:11px;color:#888}.change.up{color:#438247}.change.down{color:#bd5550}
    .panel{background:#fff;border:1px solid var(--line);margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}.panel h2{margin:0;font-size:16px}.metric-buttons{display:flex;gap:5px;flex-wrap:wrap}.metric-buttons button{border:1px solid #ddd;background:#fff;color:#777;padding:6px 8px;font:600 11px "Noto Sans KR",sans-serif;cursor:pointer}.metric-buttons button.active{border-color:#333;background:#333;color:#fff}.chart-wrap{padding:18px}.chart{width:100%;height:240px;display:block;overflow:visible}.chart-label{fill:#999;font-size:10px}.chart-line{fill:none;stroke:var(--red);stroke-width:2.5}.chart-area{fill:#e6544b;opacity:.08}.chart-point{fill:#fff;stroke:var(--red);stroke-width:2}.chart-empty{padding:68px 0;text-align:center;color:#999;font-size:13px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{background:#fafafa;color:#777;font-weight:600}.notice{padding:13px 18px;color:#888;font-size:12px;line-height:1.6;background:#fafafa;border-top:1px solid var(--line)}
    @media(max-width:650px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px;letter-spacing:-1.1px}nav{margin-left:17px;gap:16px}nav a{font-size:12px;text-align:center;line-height:1.15;white-space:nowrap}.start{display:none}#auth-area{display:flex;margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 24px);margin-top:20px}.heading{align-items:flex-start;flex-direction:column;gap:12px}.summary{grid-template-columns:repeat(2,1fr)}.card:nth-child(3n){border-right:1px solid var(--line)}.card:nth-child(2n){border-right:0}.card:nth-last-child(-n+3){border-bottom:1px solid var(--line)}.card:nth-last-child(-n+2){border-bottom:0}.panel-head{align-items:flex-start;flex-direction:column}.chart-wrap{padding:13px}.chart{height:205px}th,td{padding:10px 9px}.range{width:100%}}
  </style>
</head>
<body>
  <header>
    <a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i></a>
    <nav><a href="popular.html">인기 토론</a><a href="index.html?section=categories&amp;nav=1#categories">카테고리</a></nav>
    <a class="start" href="login.html?next=create-debate.html">토론 시작하기</a><span id="auth-area"></span>
  </header>
  <main>
    <div class="heading"><div><h1>성장 분석</h1><p>가입과 토론 활동을 바탕으로 사이트의 일별 성장 추이를 확인합니다.</p></div><select class="range" id="range" aria-label="분석 기간"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="90">최근 90일</option></select></div>
    <section class="summary" id="summary"><div class="card"><b>불러오는 중</b><strong>-</strong></div></section>
    <section class="panel"><div class="panel-head"><h2 id="chart-title">일별 순방문자</h2><div class="metric-buttons" id="metrics"></div></div><div class="chart-wrap" id="chart-wrap"></div><p class="notice">순방문자는 브라우저 기준으로 하루 1회 집계되며, 로그인이나 활동 여부와 관계없이 포함됩니다. 브라우저 데이터 삭제·다른 기기 사용 시 별도 방문으로 집계될 수 있으며 적용 시점 이후부터 기록됩니다.</p></section>
    <section class="panel"><div class="panel-head"><h2>일별 상세</h2></div><div class="table-wrap"><table><thead><tr><th>날짜</th><th>순방문자</th><th>활동 이용자</th><th>신규 가입</th><th>토론 개설</th><th>발언</th><th>댓글</th><th>투표</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <script type="module">
    import { supabase, mountAuthState } from './supabase.js?v=analytics-1';
    const labels={visitors:'순방문자',active_users:'활동 이용자',new_signups:'신규 가입자',debates_created:'토론 개설',messages_created:'발언',comments_created:'댓글',votes_created:'투표'};
    const fields=Object.keys(labels);
    // 댓글은 일별 상세와 추이에서만 제공하고, 상단의 오늘 요약에서는 제외합니다.
    const summaryFields=fields.filter(f=>f!=='comments_created');
    let data=[], selected='visitors';
    const number=n=>new Intl.NumberFormat('ko-KR').format(Number(n||0));
    const dateText=d=>new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',weekday:'short',timeZone:'Asia/Seoul'}).format(new Date(`${d}T00:00:00+09:00`));
    const escape=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    function change(now, before){const diff=Number(now)-Number(before);if(!data.length||diff===0)return '<span class="change">전일과 같음</span>';return `<span class="change ${diff>0?'up':'down'}">${diff>0?'▲':'▼'} ${number(Math.abs(diff))}</span>`}
    function drawChart(){const el=document.getElementById('chart-wrap');if(!data.length){el.innerHTML='<div class="chart-empty">표시할 데이터가 없습니다.</div>';return}const values=data.map(x=>Number(x[selected]||0)),max=Math.max(...values,1),w=800,h=240,l=34,r=10,t=14,b=34,iw=w-l-r,ih=h-t-b;const x=i=>l+(data.length===1?iw/2:i*iw/(data.length-1)),y=v=>t+ih-(v/max)*ih;let line='',area=`M ${x(0)} ${t+ih}`;values.forEach((v,i)=>{line+=`${i?' L':'M'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`;area+=` L ${x(i).toFixed(1)} ${y(v).toFixed(1)}`});area+=` L ${x(values.length-1)} ${t+ih} Z`;const marks=data.length<=7?data.map((d,i)=>i):[0,Math.floor((data.length-1)/2),data.length-1];el.innerHTML=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${labels[selected]} 추이"><line x1="${l}" y1="${t+ih}" x2="${w-r}" y2="${t+ih}" stroke="#e4e4e4"/><text x="${l}" y="${t-2}" class="chart-label">최대 ${number(max)}</text><path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>${values.map((v,i)=>`<circle class="chart-point" cx="${x(i)}" cy="${y(v)}" r="3"><title>${dateText(data[i].day)}: ${number(v)}</title></circle>`).join('')}${marks.map(i=>`<text x="${x(i)}" y="${h-10}" text-anchor="middle" class="chart-label">${String(data[i].day).slice(5).replace('-','.')}</text>`).join('')}</svg>`;document.getElementById('chart-title').textContent=`일별 ${labels[selected]}`}
    function render(){const latest=data.at(-1)||{},previous=data.at(-2)||{};document.getElementById('summary').innerHTML=summaryFields.map(f=>`<div class="card"><b>오늘 ${labels[f]}</b><strong>${number(latest[f])}</strong>${change(latest[f],previous[f])}</div>`).join('');document.getElementById('metrics').innerHTML=fields.map(f=>`<button type="button" class="${f===selected?'active':''}" data-field="${f}">${labels[f]}</button>`).join('');document.getElementById('rows').innerHTML=[...data].reverse().map(x=>`<tr><td>${escape(dateText(x.day))}</td>${fields.map(f=>`<td>${number(x[f])}</td>`).join('')}</tr>`).join('');drawChart()}
    document.getElementById('metrics').addEventListener('click',e=>{const f=e.target.dataset.field;if(!f)return;selected=f;render()});
    async function load(){const days=Number(document.getElementById('range').value);document.getElementById('summary').innerHTML='<div class="card"><b>분석 데이터를 불러오는 중입니다.</b><strong>-</strong></div>';let {data:rows,error}=await supabase.rpc('admin_growth_daily_v2',{p_days:days});if(error&&/admin_growth_daily_v2/i.test(error.message||'')){const fallback=await supabase.rpc('admin_growth_daily',{p_days:days});rows=(fallback.data||[]).map(row=>({visitors:0,...row}));error=fallback.error}if(error){document.getElementById('summary').innerHTML=`<div class="card"><b>분석 데이터를 불러오지 못했습니다.</b><strong>-</strong><span class="change">${escape(error.message)}</span></div>`;return}data=rows||[];render()}
    const {data:{user}}=await supabase.auth.getUser();if(!user){location.href='login.html?next=admin-analytics.html'}else{const {data:isAdmin}=await supabase.rpc('is_admin');if(!isAdmin){location.href='my.html'}else{mountAuthState('auth-area');load();document.getElementById('range').addEventListener('change',load)}}
  </script>
</body>
</html>
