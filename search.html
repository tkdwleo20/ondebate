<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>토론 검색 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --muted:#777; --line:#e5e5e5; --paper:#f6f6f6; --red:#e64b3c; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; }
      header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 1120px)/2)); gap:42px; position:sticky; top:0; z-index:3; } .brand { font-size:22px; font-weight:700; letter-spacing:-1.3px; text-decoration:none; color:var(--ink); } .brand i { color:var(--red); font-style:normal; } nav { display:flex; gap:26px; align-items:center; } nav a { color:#666; font-size:14px; text-decoration:none; } .start { margin-left:auto; background:#3b3b3b; color:#fff; border-radius:3px; padding:9px 14px; font-size:13px; font-weight:600; text-decoration:none; } #auth-area { display:flex; align-items:center; gap:10px; } .account-link { color:#333; text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; } .logout-button { border:0; background:transparent; color:#888; font:13px "Noto Sans KR",sans-serif; cursor:pointer; padding:8px 0; } .mobile-start,.mobile-nav { display:none; }
      main { width:min(860px,calc(100% - 36px)); margin:28px auto 70px; } .search-form { display:flex; height:43px; margin-bottom:18px; } .search-form input { flex:1; min-width:0; border:2px solid #303030; border-right:0; padding:0 13px; font:14px "Noto Sans KR",sans-serif; outline:0; } .search-form button { width:92px; border:0; background:#303030; color:#fff; font:600 13px "Noto Sans KR",sans-serif; cursor:pointer; } .section { background:#fff; border:1px solid var(--line); } .section h1 { margin:0; padding:18px; font-size:18px; letter-spacing:-.7px; border-bottom:1px solid var(--line); } .section h1 span { color:#777; font-size:13px; font-weight:500; margin-left:7px; } .debate { padding:17px 18px; border-bottom:1px solid var(--line); cursor:pointer; } .debate:last-child { border-bottom:0; } .debate:hover { background:#fafafa; } .meta { display:flex; gap:8px; align-items:center; color:#777; font-size:11px; } .badge { border-radius:4px; padding:3px 6px; font-size:10px; font-weight:800; } .live { background:#fff0ec; color:#d9422e; } .waiting { background:#edf3ff; color:#3970c9; } .ended { background:#f0f0f0; color:#777; } h2 { font-size:15px; margin:8px 0 9px; } .debate-link { color:inherit; text-decoration:none; } .opening,.empty { color:#888; font-size:12px; line-height:1.65; } .empty { padding:24px 18px; }
      @media(max-width:760px) { header { height:58px; padding:0 14px; gap:0; } .brand { font-size:19px; } nav { margin-left:17px; gap:16px; } nav a { font-size:12px; white-space:nowrap; } .desktop-nav { display:none; } .mobile-nav { display:inline; } .start { display:none; } #auth-area { margin-left:auto; min-width:0; } #auth-area .account-link { max-width:62px; overflow:hidden; text-overflow:ellipsis; font-size:12px; font-weight:800; } #auth-area .logout-button { display:none; } .mobile-start { display:flex; position:fixed; right:18px; bottom:20px; z-index:4; background:#303030; color:#fff; text-decoration:none; border-radius:24px; padding:13px 17px; font-size:13px; font-weight:700; box-shadow:0 5px 16px rgba(0,0,0,.22); } main { margin-top:20px; } }
    </style>
  </head>
  <body>
    <header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a href="index.html#popular"><span class="desktop-nav">인기 토론</span><span class="mobile-nav">인기 토론</span></a><a href="index.html#categories">카테고리</a></nav><a class="start" href="create-debate.html">토론 시작하기</a><span id="auth-area"><a class="account-link" href="login.html">로그인</a></span></header>
    <main><form class="search-form" action="search.html" method="get"><input id="query" name="q" type="search" required aria-label="토론 검색" placeholder="토론 주제를 검색하세요" /><button type="submit">검색</button></form><section class="section"><h1 id="title">검색 결과 <span id="count"></span></h1><div id="results"><div class="empty">검색어를 입력해 주세요.</div></div></section></main><a class="mobile-start" href="create-debate.html">＋ 토론 시작하기</a>
    <script type="module">
      import { supabase, mountAuthState } from './supabase.js'; mountAuthState('auth-area');
      const query = new URLSearchParams(location.search).get('q')?.trim() || ''; const input = document.getElementById('query'); const title = document.getElementById('title'); const results = document.getElementById('results'); input.value = query;
      if (query) {
        title.firstChild.textContent = `'${query}' 검색 결과 `;
        const term = `%${query}%`;
        const [{ data: titleMatches, error: titleError }, { data: messageMatches, error: messageError }] = await Promise.all([supabase.from('debates').select('id').neq('status','hidden').ilike('title', term), supabase.from('debate_messages').select('debate_id').ilike('body', term)]);
        if (titleError || messageError) results.innerHTML = '<div class="empty">검색 결과를 불러오지 못했습니다.</div>';
        else {
          const ids = [...new Set([...(titleMatches ?? []).map(row => row.id), ...(messageMatches ?? []).map(row => row.debate_id)])];
          if (!ids.length) results.innerHTML = '<div class="empty">일치하는 토론이 없습니다.</div>';
          else {
            const { data: debates, error } = await supabase.from('debates').select('id,title,category,status,ends_at,debate_messages(body,created_at)').in('id', ids).neq('status','hidden').order('created_at',{ascending:false});
            if (error) results.innerHTML = '<div class="empty">검색 결과를 불러오지 못했습니다.</div>';
            else { document.getElementById('count').textContent = `${debates?.length ?? 0}개`; results.replaceChildren(); (debates ?? []).forEach(debate => { const article=document.createElement('article'); article.className='debate'; const ended=new Date(debate.ends_at)<=new Date(); const remain=Math.max(0,new Date(debate.ends_at)-Date.now()); const badge=document.createElement('span'); badge.className=`badge ${ended?'ended':(debate.status==='waiting'?'waiting':'live')}`; badge.textContent=ended?'종료된 토론':(debate.status==='waiting'?'상대 모집 중':'진행 중'); const meta=document.createElement('div'); meta.className='meta'; meta.append(badge,document.createTextNode(` ${debate.category} · ${ended?'토론 종료':`${Math.floor(remain/3600000)}시간 ${Math.floor(remain%3600000/60000)}분 남음`}`)); const heading=document.createElement('h2'); const link=document.createElement('a'); link.className='debate-link'; link.href=`debate-detail.html?id=${debate.id}`; link.textContent=debate.title; heading.append(link); const opening=[...(debate.debate_messages??[])].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))[0]?.body??''; const body=document.createElement('div'); body.className='opening'; body.textContent=opening.length>150?`${opening.slice(0,150)}…`:opening; const target=`debate-detail.html?id=${debate.id}`; article.addEventListener('click',event=>{if(!event.target.closest('a')) location.href=target;}); article.append(meta,heading,body); results.append(article); }); }
          }
        }
      }
    </script>
  </body>
</html>
