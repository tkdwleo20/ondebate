    <style>
      :root { --ink:#222; --muted:#777; --line:#e5e5e5; --paper:#f6f6f6; --red:#d85a50; --red-bg:#fff5f3; --blue:#4b79ba; --blue-bg:#f3f7ff; }

      .brand { font:700 22px "Noto Sans KR",sans-serif; letter-spacing:-1.3px; text-decoration:none; color:var(--ink); } .brand i { color:var(--red); font-style:normal; } nav { display:flex; gap:26px; align-items:center; } nav a { color:#666; text-decoration:none; font-size:14px; } nav a.active { color:#222; font-weight:700; } .start { margin-left:auto; background:#3b3b3b; color:#fff; text-decoration:none; border-radius:3px; padding:9px 14px; font-size:13px; font-weight:600; } #auth-area { display:flex; align-items:center; gap:10px; } .account-link { color:#333; text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; } .logout-button { border:0; background:transparent; color:#888; font:13px "Noto Sans KR",sans-serif; cursor:pointer; padding:8px 0; white-space:nowrap; } .mobile-nav,.mobile-start { display:none; }
      main { width:min(980px,calc(100% - 36px)); margin:25px auto 70px; } .post { background:#fff; border:1px solid var(--line); } .topic { padding:23px 24px 20px; border-bottom:1px solid var(--line); } .crumb { color:#888; font-size:12px; margin-bottom:10px; } h1 { margin:0; font-size:22px; letter-spacing:-1px; line-height:1.4; } .topic-info { display:flex; align-items:center; gap:13px; margin-top:16px; color:#777; font-size:12px; } .topic-subinfo { display:flex; gap:12px; margin-top:9px; color:#999; font-size:11px; } .live { color:#cf493c; font-weight:700; } .ended-state { color:#777; font-weight:700; } .vote-count { margin-left:auto; color:#666; } .report-button { margin-left:auto; border:0; background:none; color:#999; font:11px "Noto Sans KR",sans-serif; cursor:pointer; padding:0; } .report-button:hover { color:#a34840; text-decoration:underline; } .report-panel { margin-top:13px; padding:12px; border:1px solid #ead7d4; background:#fffafa; } .report-panel[hidden] { display:none; } .report-panel label { display:block; color:#666; font-size:11px; margin:8px 0 4px; } .report-panel select,.report-panel input { width:100%; height:34px; border:1px solid #d8d8d8; padding:0 8px; background:#fff; font-size:12px; } .report-actions { display:flex; justify-content:flex-end; gap:6px; margin-top:9px; } .report-actions button { border:1px solid #c8c8c8; background:#fff; color:#555; padding:6px 9px; font-size:11px; cursor:pointer; } .report-actions .submit-report { border-color:#9c4740; background:#9c4740; color:#fff; }
      .timeline { padding:24px; background:#fcfcfc; } .timeline-label { color:#888; font-size:12px; text-align:center; margin:0 0 17px; } .message-row { display:flex; margin:13px 0; } .message-row.right { justify-content:flex-end; } .message { width:fit-content; max-width:min(78%,590px); } .message-author { margin:0 0 5px; color:#666; font-size:11px; font-weight:700; } .user-level { margin-left:4px; color:#aaa; font-size:10px; font-weight:500; } .right .message-author { text-align:right; } .message-box { padding:13px 15px; border:1px solid var(--line); border-radius:5px; background:#fff; font-size:14px; line-height:1.7; letter-spacing:-.2px; } .message-box.deleted-message { color:#999; border-style:dashed; background:#fafafa; font-style:italic; } .left .message-box { border-left:3px solid var(--red); } .right .message-box { border-right:3px solid var(--blue); background:var(--blue-bg); text-align:right; } .right .message-box.deleted-message { background:#fafafa; } .message-meta { display:flex; align-items:center; gap:7px; margin-top:6px; color:#999; font-size:11px; } .right .message-meta { justify-content:flex-end; } .reply-toggle,.delete-message { border:0; background:none; padding:0; color:#777; cursor:pointer; font-size:11px; } .reply-toggle:hover,.delete-message:hover { text-decoration:underline; } .delete-message { color:#a85a54; } .timeline-update { display:flex; justify-content:center; margin:-6px 24px 18px; } .timeline-update[hidden] { display:none; } .timeline-update button { border:1px solid #d4d4d4; border-radius:999px; background:#fff; color:#555; padding:7px 13px; font:12px "Noto Sans KR",sans-serif; cursor:pointer; box-shadow:0 2px 7px rgba(0,0,0,.06); } .timeline-update button:hover { border-color:#888; color:#222; }
      .speaker-form { margin:0 24px 24px; padding:15px; border:1px solid #d8d8d8; background:#fff; } .speaker-form[hidden] { display:none; } .speaker-form strong { display:block; margin-bottom:8px; font-size:13px; } .speaker-form p { margin:0 0 10px; color:#777; font-size:12px; } .speaker-form textarea { display:block; width:100%; min-height:92px; border:1px solid #d5d5d5; padding:10px; resize:vertical; font:13px/1.65 "Noto Sans KR",sans-serif; } .speaker-form .form-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:9px; gap:10px; } .speaker-notice { color:#b53e31; font-size:12px; } .speaker-form button { border:0; background:#3b3b3b; color:#fff; padding:9px 14px; font-size:12px; cursor:pointer; } .speaker-form button:disabled { background:#999; cursor:wait; }
      .heart-button { border:0; background:none; color:#777; padding:0; font-size:11px; cursor:pointer; } .reaction-icon { width:15px; height:15px; vertical-align:-3px; margin-right:3px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linejoin:round; } .heart-button.liked { color:#316ed5; font-weight:700; } .inline-replies { display:none; margin-top:9px; border:1px solid #e8e8e8; background:#fff; padding:10px; } .inline-replies.open { display:block; } .reply { border-bottom:1px solid #eee; padding:0 0 8px; margin-bottom:8px; font-size:12px; line-height:1.55; } .reply:last-of-type { border-bottom:0; } .reply.nested-comment, .comment.nested-comment { margin-left:20px; padding-left:12px; border-left:2px solid #e5e5e5; } .reply b { margin-right:6px; font-size:11px; } .reply-head, .comment-head { display:flex; align-items:center; gap:6px; } .reply-head b, .comment-head b { margin-right:0; } .reply.deleted-comment p, .comment.deleted-comment p { color:#999; font-style:italic; } .reply-form { display:flex; gap:6px; margin-top:5px; } .reply-form[hidden] { display:none !important; } .reply-form input { min-width:0; flex:1; height:30px; border:1px solid #d4d4d4; padding:0 8px; font-size:12px; } .reply-form button { border:1px solid #555; background:#555; color:#fff; padding:0 10px; font-size:11px; cursor:pointer; } .comment-actions { display:flex; gap:10px; margin-top:7px; } .comment-actions button, .delete-comment { border:0; background:none; color:#777; padding:0; font-size:11px; cursor:pointer; } .comment-actions .heart.active { color:#316ed5; font-weight:700; } .delete-comment { color:#a85a54; }
      .section { margin-top:18px; background:#fff; border:1px solid var(--line); } .section h2 { margin:0; font-size:16px; padding:17px 20px; border-bottom:1px solid var(--line); } .winner { padding:20px; } .winner p { margin:0 0 15px; color:#666; font-size:13px; } .vote-options { display:grid; grid-template-columns:1fr 1fr; gap:9px; } .vote-option { appearance:none; text-align:left; background:#fff; color:var(--ink); font-family:inherit; border:1px solid #dadada; padding:13px; cursor:pointer; } .vote-option b { display:block; font-size:14px; margin-bottom:4px; } .vote-option span { font-size:12px; color:#777; } .vote-option:first-child { border-left:3px solid var(--red); } .vote-option:last-child { border-right:3px solid var(--blue); } .vote-option:hover { background:#fafafa; } .vote-option.is-winner { background:#fff8f7; border-color:#dca39d; } .vote-option.is-winner:last-child { background:#f4f7ff; border-color:#aebfe0; } .winner-badge { display:inline-block; margin-left:6px; padding:2px 5px; border-radius:3px; background:#a9483e; color:#fff; font-size:10px; font-style:normal; vertical-align:2px; } .vote-option.is-winner:last-child .winner-badge { background:#4b79ba; } .vote-result { margin-top:15px; } .vote-result[hidden] { display:none; } .vote-result-labels { display:flex; justify-content:space-between; margin-bottom:6px; font-size:11px; font-weight:700; } .vote-result-labels span:first-child { color:#bd4b40; } .vote-result-labels span:last-child { color:#4b79ba; } .vote-bar { display:flex; height:8px; overflow:hidden; border-radius:999px; background:#eee; } .vote-bar-left { background:#dc665b; transition:width .25s; } .vote-bar-right { background:#6289c4; transition:width .25s; } .vote-result-note { margin:7px 0 0; color:#888; font-size:11px; text-align:center; }
      .comments { padding:0 20px 20px; } .comment { padding:15px 0; border-bottom:1px solid var(--line); } .comment.reply-comment { margin-left:20px; padding-left:13px; border-left:2px solid #eee; } .comment-head { font-size:12px; } .comment-head b { margin-right:7px; } .comment-head span { color:#999; } .comment p { font-size:13px; margin:7px 0 0; line-height:1.6; } .comment-reply { border:0; background:none; color:#777; padding:0; margin-top:7px; font-size:11px; cursor:pointer; } .comment-form { padding:16px 20px; background:#fafafa; border-top:1px solid var(--line); display:flex; gap:7px; } .comment-form input { min-width:0; flex:1; height:39px; border:1px solid #d8d8d8; padding:0 10px; font-size:13px; } .comment-form button { border:0; background:#3b3b3b; color:#fff; padding:0 15px; font-size:12px; cursor:pointer; } .nested-comment-form { display:flex; gap:6px; margin-top:10px; } .nested-comment-form input { min-width:0; flex:1; height:32px; border:1px solid #d8d8d8; padding:0 9px; font-size:12px; } .nested-comment-form button { border:1px solid #555; background:#fff; color:#555; padding:0 10px; font-size:11px; cursor:pointer; }
      @media(max-width:700px) { header { height:58px; padding:0 14px; gap:0; } .brand { font-size:19px; } nav { margin-left:17px; gap:16px; } nav a { font-size:12px; text-align:center; line-height:1.15; } .desktop-nav { display:none; } .mobile-nav { display:inline; } .start { display:none; } #auth-area { margin-left:auto; min-width:0; } #auth-area .account-link { max-width:62px; overflow:hidden; text-overflow:ellipsis; font-size:12px; font-weight:800; } #auth-area .logout-button { display:none; } .mobile-start { display:flex; position:fixed; right:18px; bottom:20px; z-index:4; align-items:center; background:#303030; color:#fff; text-decoration:none; border-radius:24px; padding:13px 17px; box-shadow:0 5px 16px rgba(0,0,0,.22); font-size:13px; font-weight:700; } main { width:calc(100% - 24px); margin-top:12px; } .topic,.timeline { padding:18px 14px; } h1 { font-size:19px; } .topic-info { flex-wrap:wrap; gap:7px 10px; } .vote-count { margin-left:0; } .message { width:fit-content; max-width:92%; } .message-box { font-size:13px; } .comments { padding:0 14px 14px; } .comment-form { padding:14px; } }
    </style>
    <style>
      .source-list { margin-top:18px; background:#fff; border:1px solid var(--line); }
      .source-list[hidden] { display:none; }
      .source-list h2 { margin:0; padding:15px 18px; border-bottom:1px solid var(--line); font-size:14px; }
      .source-list a { display:block; padding:12px 18px; color:#444; text-decoration:none; border-bottom:1px solid #eee; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .source-list a:last-child { border-bottom:0; }
      .source-list a:hover { background:#fafafa; color:#222; }
      .source-list a.is-current { background:#f7f7f7; color:#222; font-weight:700; }
      .source-list a.is-current small { margin-left:7px; color:#a55a52; font-size:10px; font-weight:600; }
    </style>
  </head>
  <body>
    <header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a href="index.html#popular"><span class="desktop-nav">인기 토론</span><span class="mobile-nav">인기 토론</span></a><a href="index.html#categories">카테고리</a></nav><a class="start" href="login.html?next=create-debate.html">토론 시작하기</a><span id="auth-area" style="visibility:hidden"><a class="account-link" href="login.html">로그인</a></span></header>
    <main>
      <article class="post">
        <div class="topic"><div class="crumb" id="topic-category">토론</div><h1 id="topic-title">토론을 불러오는 중입니다.</h1><div class="topic-info"><span class="live" id="debate-state">불러오는 중</span><span id="remaining-time"></span><span class="vote-count">관전자 투표 0</span></div><div class="topic-subinfo"><span id="created-time"></span><span id="view-count"></span><button class="report-button" id="report-button" type="button">신고</button></div><form class="report-panel" id="report-panel" hidden><label for="reported-user">신고 대상</label><select id="reported-user" required></select><label for="report-reason">신고 사유</label><input id="report-reason" minlength="5" maxlength="1000" placeholder="5자 이상 입력해 주세요" required /><div class="report-actions"><button id="cancel-report" type="button">취소</button><button class="submit-report" type="submit">신고 접수</button></div></form></div>
        <section class="timeline" id="timeline"></section>
        <div class="timeline-update" id="timeline-update" hidden><button id="new-message-notice" type="button"></button></div>
        <form class="speaker-form" id="message-form" hidden>
          <strong id="message-form-title">발언 남기기</strong><p id="message-form-description"></p>
          <textarea id="message-body" maxlength="3000" required placeholder="상대방의 주장에 대한 의견을 남겨주세요"></textarea>
          <div class="form-bottom"><span class="speaker-notice" id="message-notice"></span><button type="submit" id="message-submit">발언 등록</button></div>
        </form>
      </article>
      <section class="section"><div class="winner"><p id="vote-notice">토론 종료 전까지 관전자 한 표를 행사할 수 있습니다.</p><div class="vote-options"><button class="vote-option" id="vote-left"><b>왼쪽 주장에 투표</b><span>현재 0표</span></button><button class="vote-option" id="vote-right"><b>오른쪽 주장에 투표</b><span>현재 0표</span></button></div><div class="vote-result" id="vote-result" hidden><div class="vote-result-labels"><span id="left-rate">왼쪽 0%</span><span id="right-rate">오른쪽 0%</span></div><div class="vote-bar"><span class="vote-bar-left" id="left-bar"></span><span class="vote-bar-right" id="right-bar"></span></div></div></div></section>
      <section class="section"><h2>관전자 댓글 <span id="debate-comment-count" style="color:#888;font-size:12px;font-weight:500">0</span></h2><div class="comments" id="debate-comments"></div><form class="comment-form" id="debate-comment-form" hidden><input id="debate-comment-body" placeholder="토론 전체에 대한 의견을 남겨주세요" maxlength="1000" /><button type="submit">등록</button></form></section>
      <section class="source-list" id="source-list" hidden><h2 id="source-list-title">목록의 다른 글</h2><div id="source-list-items"></div></section>
    </main>
    <a class="mobile-start" href="login.html?next=create-debate.html">＋ 토론 시작하기</a>
    <script type="module">
      import { supabase, getProfile, levelForPoints, mountAuthState } from './supabase.js?v=auth-header-2';
      mountAuthState('auth-area');
      const detailParams = new URLSearchParams(location.search);
      const debateId = detailParams.get('id');
      let sourceType = detailParams.get('from');
      if (!sourceType) {
        try {
          const previous = new URL(document.referrer);
          if (previous.origin === location.origin) {
            const page = previous.pathname.split('/').pop() || 'index.html'; const previousParams = previous.searchParams;
            if (page === 'index.html') sourceType = 'home';
            else if (page === 'category.html') { sourceType = 'category'; detailParams.set('category', previousParams.get('name') || ''); }
            else if (page === 'search.html') { sourceType = 'search'; detailParams.set('q', previousParams.get('q') || ''); }
            else if (page === 'popular.html') sourceType = 'popular-weekly';
          }
        } catch (_) { /* Direct visit: there is no previous list to restore. */ }
      }
      let viewerKey = localStorage.getItem('ondebate-viewer-key'); if (!viewerKey) { viewerKey = crypto.randomUUID(); localStorage.setItem('ondebate-viewer-key', viewerKey); }
      const timeline = document.getElementById('timeline');
      const messageForm = document.getElementById('message-form'); const messageFormTitle = document.getElementById('message-form-title'); const messageFormDescription = document.getElementById('message-form-description'); const messageBody = document.getElementById('message-body'); const messageNotice = document.getElementById('message-notice'); const messageSubmit = document.getElementById('message-submit');
      const debateCommentsBox = document.getElementById('debate-comments'); const debateCommentForm = document.getElementById('debate-comment-form'); const debateCommentInput = document.getElementById('debate-comment-body'); const voteLeft = document.getElementById('vote-left'); const voteRight = document.getElementById('vote-right'); const voteNotice = document.getElementById('vote-notice'); const voteResult = document.getElementById('vote-result'); const reportButton = document.getElementById('report-button'); const reportPanel = document.getElementById('report-panel'); const reportedUser = document.getElementById('reported-user'); const reportReason = document.getElementById('report-reason');
      let mySide = null, currentUser = null, activeDebate = null, messageComments = [], debateComments = [], profileNames = new Map(), likedMessages = new Set(), likedMessageComments = new Set(), likedDebateComments = new Set(), realtimeTimer = null, pendingRealtimeChanges = 0;
      const newMessageNotice = document.getElementById('new-message-notice'); const timelineUpdate = document.getElementById('timeline-update');

      function detailUrlForSource(id) {
        const params = new URLSearchParams(detailParams); params.set('id', id);
        return `debate-detail.html?${params.toString()}`;
      }
      async function renderSourceList() {
        if (!sourceType) return;
        const panel = document.getElementById('source-list'); const title = document.getElementById('source-list-title'); const items = document.getElementById('source-list-items');
        let label = '목록의 다른 글', rows = [], error = null;
        if (sourceType === 'home') {
          label = '지금 뜨거운 토론 다른 글'; ({ data:rows, error } = await supabase.rpc('list_debates_page', { p_category:null, p_page:1, p_page_size:20 }));
        } else if (sourceType === 'category') {
          const category = detailParams.get('category') || ''; label = `${category} 다른 글`;
          ({ data:rows, error } = await supabase.rpc('list_debates_page', { p_category:category, p_page:1, p_page_size:20 }));
        } else if (sourceType === 'search') {
          const query = detailParams.get('q') || ''; label = `'${query}' 검색결과 다른 글`;
          ({ data:rows, error } = query ? await supabase.rpc('search_debates_page', { p_query:query, p_page:1, p_page_size:20 }) : { data:[] });
        } else if (sourceType === 'popular-daily' || sourceType === 'popular-weekly') {
          const daily = sourceType === 'popular-daily'; label = daily ? '일간 인기 토론 다른 글' : '주간 인기 토론 다른 글';
          ({ data:rows, error } = await supabase.rpc('popular_debates', { p_hours:daily ? 24 : 168 }));
        } else return;
        const sourceRows = (rows || []).slice(0, 10);
        if (error || !sourceRows.length) return;
        title.textContent = label; items.replaceChildren();
        sourceRows.forEach(row => {
          const link = document.createElement('a'); const isCurrent = row.id === debateId;
          link.href = detailUrlForSource(row.id); link.className = isCurrent ? 'is-current' : ''; link.textContent = row.title;
          if (isCurrent) { const current = document.createElement('small'); current.textContent = '현재 보고 있는 글'; link.append(current); }
          items.append(link);
        });
        panel.hidden = false;
      }
      const profileFor = entry => profileNames.get(entry.author_id);
      const nickname = entry => {
        const profile = profileFor(entry);
        return profile?.nickname || '탈퇴한 사용자';
      };
      const profileLevel = profile => profile?.level ?? levelForPoints(profile?.points);
      const identityText = entry => { const profile = profileFor(entry); return profile ? `${profile.nickname} Lv.${profileLevel(profile)}` : '탈퇴한 사용자'; };
      function showIdentity(element, entry) { const profile = profileFor(entry); element.textContent = profile?.nickname || '탈퇴한 사용자'; if (profile) { const level = document.createElement('span'); level.className = 'user-level'; level.textContent = `Lv.${profileLevel(profile)}`; element.append(level); } }
      const timeText = value => new Date(value).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
      const thumbMarkup = count => `<svg class="reaction-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h4V9H1v12zM23 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"></path></svg><span>${count}</span>`;

      async function sendComment(type, body, targetId, parentId = null) {
        if (!currentUser) { location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`; return; }
        const rpc = type === 'message' ? 'add_message_comment' : 'add_debate_comment';
        const args = type === 'message' ? { p_message_id:targetId, p_body:body } : { p_debate_id:targetId, p_body:body };
        if (parentId) args.p_parent_id = parentId;
        const viaFunction = await supabase.rpc(rpc, args);
        if (!viaFunction.error) { location.reload(); return; }
        const table = type === 'message' ? 'message_comments' : 'debate_comments';
        const row = type === 'message' ? { message_id:targetId, author_id:currentUser.id, body } : { debate_id:targetId, author_id:currentUser.id, body };
        if (parentId) row.parent_id = parentId;
        const { error } = await supabase.from(table).insert(row);
        if (error) { alert(`댓글을 저장하지 못했습니다. ${error.message}`); return; }
        location.reload();
