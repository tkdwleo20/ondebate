<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>알림 — OnDebate</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><style>:root{--ink:#222;--line:#e5e5e5;--paper:#f6f6f6;--red:#d85a50}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 980px)/2));gap:42px}.brand{color:#222;text-decoration:none;font-size:22px;font-weight:700;letter-spacing:-1.3px}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px}nav a{color:#666;font-size:14px;text-decoration:none}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer}main{width:min(780px,calc(100% - 36px));margin:28px auto 70px}h1{margin:0 0 18px;font-size:22px}.section{background:#fff;border:1px solid var(--line)}.item{display:block;padding:16px 18px;color:#333;text-decoration:none;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item.unread{background:#fff9f8}.body{font-size:14px;line-height:1.55}.time{margin-top:5px;color:#999;font-size:12px}.empty{margin:0;padding:20px;color:#888;font-size:13px}@media(max-width:650px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px}nav{margin-left:17px;gap:16px}nav a{font-size:12px}.start{display:none}#auth-area{margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 28px);margin-top:22px}}</style></head><body><header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a href="index.html#popular">인기 토론</a><a href="index.html#categories">카테고리</a></nav><a class="start" href="login.html?next=create-debate.html">토론 시작하기</a><span id="auth-area"></span></header><main><h1>알림</h1><section class="section" id="notifications"><p class="empty">알림을 불러오는 중입니다.</p></section></main><script type="module">import{supabase,mountAuthState}from'./supabase.js';const{data:{user}}=await supabase.auth.getUser();if(!user){location.href='login.html?next=notifications.html'}else{mountAuthState('auth-area');const list=document.getElementById('notifications');const{data:items,error}=await supabase.from('notifications').select('id,debate_id,body,is_read,created_at').eq('recipient_id',user.id).order('created_at',{ascending:false}).limit(100);if(error){list.innerHTML='<p class="empty">알림을 불러오지 못했습니다.</p>'}else if(!items?.length){list.innerHTML='<p class="empty">새 알림이 없습니다.</p>'}else{list.replaceChildren();items.forEach(item=>{const row=document.createElement('a');row.className=`item${item.is_read?'':' unread'}`;row.href=item.debate_id?`debate-detail.html?id=${item.debate_id}`:'index.html';const body=document.createElement('div');body.className='body';body.textContent=item.body;const time=document.createElement('div');time.className='time';time.textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'short',timeStyle:'short'}).format(new Date(item.created_at));row.append(body,time);list.append(row)});const unread=items.filter(item=>!item.is_read).map(item=>item.id);if(unread.length)await supabase.from('notifications').update({is_read:true}).in('id',unread).eq('recipient_id',user.id)}}}</script></body></html>
