<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 확인 중 — OnDebate</title>
    <style>html,body{margin:0;background:#f6f6f6}body{min-height:100vh;display:grid;place-items:center;color:#777;font:13px "Noto Sans KR",system-ui,sans-serif}</style>
  </head>
  <body>
    <span id="message">로그인 정보를 확인하고 있습니다…</span>
    <script type="module">
      import { supabase } from './supabase.js?v=policy-consent-1';
      const message = document.getElementById('message');
      const requested = new URLSearchParams(location.search).get('next') || 'index.html';
      const next = /^[a-z0-9][a-z0-9-]*\.html(?:[?#].*)?$/i.test(requested) ? requested : 'index.html';
      async function waitForUser() {
        for (let attempt = 0; attempt < 30; attempt += 1) {
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.user) return session.user;
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        return null;
      }
      const user = await waitForUser();
      if (!user) location.replace('login.html?next=' + encodeURIComponent(next));
      else {
        try {
          const { data: profile, error } = await supabase.from('profiles').select('id,nickname').eq('id', user.id).maybeSingle();
          if (error) throw error;
          if (!profile || /^토론자[0-9a-f]{6}$/i.test(profile.nickname)) location.replace('nickname.html?next=' + encodeURIComponent(next));
          else location.replace(next);
        } catch (_) { message.textContent = '로그인 정보를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.'; }
      }
    </script>
  </body>
</html>
