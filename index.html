<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnDebate — 생각이 맞붙는 곳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --muted:#777; --line:#e5e5e5; --paper:#f6f6f6; --red:#e64b3c; --blue:#3478e5; --yellow:#fff5c9; }
      * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; }
      header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 1120px)/2)); gap:42px; position:sticky; top:0; z-index:3; }
      .brand { font:700 22px "Noto Sans KR",sans-serif; letter-spacing:-1.3px; text-decoration:none; color:var(--ink); } .brand i { color:var(--red); font-style:normal; }
      nav { display:flex; gap:26px; height:100%; align-items:center; } nav a { font-size:14px; text-decoration:none; color:#666; font-weight:500; } nav a.active { color:var(--ink); font-weight:700; }
      .start { margin-left:auto; background:#3b3b3b; color:#fff; text-decoration:none; border-radius:3px; padding:9px 14px; font-size:13px; font-weight:600; } #auth-area { display:flex; align-items:center; gap:10px; } .account-link { color:#333; text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; } .logout-button { border:0; background:transparent; color:#888; font:13px "Noto Sans KR",sans-serif; cursor:pointer; padding:8px 0; white-space:nowrap; } .mobile-start { display:none; }
      main { max-width:1120px; margin:0 auto; padding:28px 28px 70px; } .search-area { background:#fff; border:1px solid var(--line); padding:22px; margin-bottom:22px; }
      .search-area h1 { font-size:16px; margin:0 0 13px; letter-spacing:-.5px; } .search-form { display:flex; max-width:680px; height:43px; } .search-form input { min-width:0; flex:1; border:2px solid #303030; border-right:0; padding:0 13px; font:14px "Noto Sans KR",sans-serif; outline:0; } .search-form button { width:92px; border:0; background:#303030; color:#fff; font:600 13px "Noto Sans KR",sans-serif; cursor:pointer; }
      .search-hints { margin-top:10px; color:#888; font-size:12px; } .search-hints a { color:#777; text-decoration:none; margin-left:8px; }
      .layout { display:grid; grid-template-columns:minmax(0,1fr) 255px; gap:24px; } h2 { margin:0; font-size:16px; letter-spacing:-.6px; } .section { background:#fff; border:1px solid var(--line); margin-bottom:20px; } .section > h2 { padding:16px 18px; border-bottom:1px solid var(--line); }
      .debate { background:#fff; border-bottom:1px solid var(--line); padding:17px 18px; transition:.15s; } .debate:last-child { border-bottom:0; } .debate:hover { background:#fafafa; } .debate-card { cursor:pointer; } .debate-card:focus-visible { outline:2px solid #555; outline-offset:-3px; }
      .meta { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); } .badge { border-radius:4px; padding:3px 6px; font-size:10px; font-weight:800; } .live { background:#fff0ec; color:#d9422e; } .waiting { background:#edf3ff; color:#3970c9; } .ended { background:#f0f0f0; color:#777; }
      .debate h3 { font-size:15px; letter-spacing:-.55px; margin:8px 0 9px; font-weight:600; } .debate-link { color:inherit; text-decoration:none; } .debate-link:hover { text-decoration:underline; } .debate-note { color:#888; font-size:12px; } .stats { margin-left:auto; color:var(--muted); font-size:11px; font-weight:500; }
      #categories { scroll-margin-top:78px; } .category-grid { display:grid; grid-template-columns:repeat(2,1fr); } .category { appearance:none; width:100%; text-align:left; background:#fff; color:var(--ink); border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:15px 18px; cursor:pointer; font-family:inherit; transition:.15s; } .category:nth-child(2n) { border-right:0; } .category:nth-last-child(-n+2) { border-bottom:0; } .category:hover, .category.active { background:#f6f6f6; } .category.active b { color:var(--red); } .category b { display:block; font-size:14px; margin-bottom:5px; } .category span { font-size:11px; color:var(--muted); }
      aside { background:#fff; border:1px solid var(--line); height:max-content; } aside h2 { padding:16px; border-bottom:1px solid var(--line); } .rank { display:flex; align-items:center; gap:9px; padding:10px 14px; border-bottom:1px solid var(--line); } .rank strong { width:18px; font:500 12px "DM Mono"; color:var(--muted); } .avatar { width:28px; height:28px; border-radius:3px; display:grid; place-items:center; font-size:11px; font-weight:800; background:#f2e5ce; } .rank:nth-child(3) .avatar { background:#e8edf9; } .rank:nth-child(4) .avatar { background:#e5f0e7; } .user { min-width:0; } .user b { font-size:12px; display:block; } .user span { color:var(--muted); font-size:10px; } .points { margin-left:auto; color:#b97b00; font:600 11px "Noto Sans KR",sans-serif; font-variant-numeric:tabular-nums; }
      .empty-rank { margin:0; padding:16px 14px; color:#888; font-size:12px; } .rank-info { margin:0; padding:9px 14px; border-bottom:1px solid var(--line); color:#888; font-size:11px; }
      .mobile-nav { display:none; } @media (max-width:760px) { header { height:58px; padding:0 14px; gap:0; } .brand { font-size:19px; letter-spacing:-1.1px; } nav { margin-left:17px; gap:16px; } nav a { font-size:12px; text-align:center; line-height:1.15; white-space:nowrap; } .desktop-nav { display:none; } .mobile-nav { display:inline; } .start { display:none; } #auth-area { display:flex; margin-left:auto; min-width:0; } #auth-area .account-link { max-width:62px; overflow:hidden; text-overflow:ellipsis; font-size:12px; font-weight:800; } #auth-area .logout-button { display:none; } .mobile-start { display:flex; position:fixed; right:18px; bottom:20px; z-index:4; align-items:center; gap:6px; background:#303030; color:#fff; text-decoration:none; border-radius:24px; padding:13px 17px; box-shadow:0 5px 16px rgba(0,0,0,.22); font-size:13px; font-weight:700; } main { padding:18px; } .search-area { padding:16px; } .search-form button { width:64px; font-size:12px; } .search-form input { font-size:12px; padding:0 10px; } .layout { display:block; } aside { margin-top:20px; } .category-grid { grid-template-columns:1fr; } .category, .category:nth-child(2n) { border-right:0; } .category:nth-last-child(-n+2) { border-bottom:1px solid var(--line); } .category:last-child { border-bottom:0; } }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="#">On<i>Debate</i></a>
      <nav><a href="#popular"><span class="desktop-nav">인기 토론</span><span class="mobile-nav">인기 토론</span></a><a href="#categories">카테고리</a></nav>
      <a class="start" href="login.html?next=create-debate.html">토론 시작하기</a><span id="auth-area" style="visibility:hidden"><a class="account-link" href="login.html">로그인</a></span>
    </header>
    <main>
      <section class="search-area">
        <h1>토론 주제 검색</h1>
        <form class="search-form" action="search.html" method="get"><input name="q" type="search" placeholder="궁금한 토론 주제를 검색하세요" aria-label="토론 주제 검색" required /><button type="submit">검색</button></form>
      </section>
      <div class="layout">
        <div>
          <section class="section" id="popular"><h2 id="list-title">지금 뜨거운 토론</h2><div id="popular-list"></div>
          </section>
          <section class="section" id="categories"><h2>카테고리</h2><div class="category-grid" id="category-list"></div></section>
        </div>
        <aside><h2>승률 랭킹</h2><p class="rank-info">최근 1주일 내 종료된 토론의 관전자 투표 결과 기준</p><div id="rank-list"><p class="empty-rank">랭킹을 불러오는 중입니다.</p></div></aside>
      </div>
    </main>
    <a class="mobile-start" href="login.html?next=create-debate.html">＋ 토론 시작하기</a>
    <script type="module">
      import { supabase, mountAuthState } from './supabase.js?v=notification-groups-1';
      mountAuthState('auth-area');
      const list = document.getElementById('popular-list');
      const categoryList = document.getElementById('category-list');
      const rankList = document.getElementById('rank-list');
      const categories = ['일상', '사회 · 정치', '연애', '문화 · 취미', '게임 · 스포츠', '학교 · 직장'];
      const { data: debates, error: debatesError } = await supabase.rpc('list_debates_page', { p_category:null, p_page:1, p_page_size:20 });

      const allDebates = debates ?? [];
      function renderDebates() {
        list.replaceChildren();
        if (!allDebates.length) {
          list.textContent = '아직 등록된 토론이 없습니다.';
          return;
        }
        allDebates.forEach(debate => {
          const article = document.createElement('article'); article.className = 'debate debate-card'; article.tabIndex = 0; article.setAttribute('role', 'link');
          const meta = document.createElement('div'); meta.className = 'meta';
          const ended = new Date(debate.ends_at) <= new Date();
          const badge = document.createElement('span'); badge.className = `badge ${ended ? 'ended' : (debate.status === 'waiting' ? 'waiting' : 'live')}`; badge.textContent = ended ? '종료된 토론' : (debate.status === 'waiting' ? '상대 모집 중' : '진행 중');
          const remain = Math.max(0, new Date(debate.ends_at) - Date.now()); const hours = Math.floor(remain / 3600000); const minutes = Math.floor(remain % 3600000 / 60000);
          meta.append(badge, document.createTextNode(` ${debate.category}${ended ? '' : `  ${hours}시간 ${minutes}분 남음`}`));
          const heading = document.createElement('h3'); const link = document.createElement('a'); link.className = 'debate-link'; link.href = `debate-detail.html?id=${debate.id}`; link.textContent = debate.title; heading.append(link);
          const openingMessage = debate.opening_preview || '첫 발언을 불러올 수 없습니다.';
          const note = document.createElement('div'); note.className = 'debate-note'; note.textContent = openingMessage.length > 150 ? `${openingMessage.slice(0, 150)}…` : openingMessage;
          const destination = `debate-detail.html?id=${debate.id}`; article.addEventListener('click', event => { if (!event.target.closest('a')) location.href = destination; }); article.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); location.href = destination; } });
          article.append(meta, heading, note); list.append(article);
        });
      }

      if (debatesError) {
        list.textContent = '토론 목록을 불러오지 못했습니다.';
      } else {
        categories.forEach(category => {
          const button = document.createElement('button'); button.type = 'button'; button.className = 'category';
          const count = allDebates.filter(debate => debate.category === category).length;
          button.innerHTML = `<b>${category}</b><span>새 토론 ${count}개</span>`;
          button.addEventListener('click', () => { location.href = `category.html?name=${encodeURIComponent(category)}`; });
          categoryList.append(button);
        });
        renderDebates();
        if (new URLSearchParams(location.search).get('section') === 'categories') {
          requestAnimationFrame(() => document.getElementById('categories').scrollIntoView({ block:'start' }));
        }
      }

      async function renderRankings() {
        const { data: ranked, error } = await supabase.rpc('weekly_win_rankings');
        if (error) { rankList.textContent = '랭킹을 불러오지 못했습니다.'; return; }
        if (!ranked.length) { rankList.textContent = '아직 승부가 확정된 토론이 없습니다.'; return; }
        rankList.replaceChildren();
        ranked.forEach((record, index) => {
          const row = document.createElement('div'); row.className = 'rank';
          const place = document.createElement('strong'); place.textContent = String(index + 1).padStart(2, '0');
          const name = record.nickname || '탈퇴한 사용자'; const avatar = document.createElement('span'); avatar.className = 'avatar'; avatar.textContent = name.slice(0, 1);
          const user = document.createElement('div'); user.className = 'user'; const userName = document.createElement('b'); userName.textContent = name; const info = document.createElement('span'); info.textContent = `${record.wins}승 ${record.total - record.wins}패`; user.append(userName, info);
          const rate = document.createElement('span'); rate.className = 'points'; rate.textContent = `승률 ${Math.round(Number(record.wins) / Number(record.total) * 100)}%`;
          row.append(place, avatar, user, rate); rankList.append(row);
        });
      }
      renderRankings();
    </script>
  </body>
</html>
