<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카테고리 토론 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --muted:#777; --line:#e5e5e5; --paper:#f6f6f6; --red:#e64b3c; }
      * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; }
      header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 1120px)/2)); gap:42px; position:sticky; top:0; z-index:3; }
      .brand { font-size:22px; font-weight:700; letter-spacing:-1.3px; text-decoration:none; color:var(--ink); } .brand i { color:var(--red); font-style:normal; } nav { display:flex; gap:26px; height:100%; align-items:center; } nav a { color:#666; font-size:14px; font-weight:500; text-decoration:none; } nav a.active { color:var(--ink); font-weight:700; } .start { margin-left:auto; background:#3b3b3b; color:#fff; border-radius:3px; padding:9px 14px; font-size:13px; font-weight:600; text-decoration:none; } #auth-area { display:flex; align-items:center; gap:10px; } .account-link { color:#333; text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; } .logout-button { border:0; background:transparent; color:#888; font:13px "Noto Sans KR",sans-serif; cursor:pointer; padding:8px 0; white-space:nowrap; } .mobile-start { display:none; }
      main { width:min(860px,calc(100% - 36px)); margin:28px auto 70px; } .back { display:inline-block; margin-bottom:14px; color:#777; font-size:13px; text-decoration:none; } .section { background:#fff; border:1px solid var(--line); } .section h1 { margin:0; padding:18px; font-size:19px; letter-spacing:-.8px; border-bottom:1px solid var(--line); } .section h1 span { color:#777; font-size:13px; font-weight:500; margin-left:7px; }
      .debate { border-bottom:1px solid var(--line); padding:17px 18px; cursor:pointer; transition:.15s; } .debate:last-child { border-bottom:0; } .debate:hover { background:#fafafa; } .debate:focus-visible { outline:2px solid #555; outline-offset:-3px; } .meta { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); } .badge { border-radius:4px; padding:3px 6px; font-size:10px; font-weight:800; } .live { background:#fff0ec; color:#d9422e; } .waiting { background:#edf3ff; color:#3970c9; } .ended { background:#f0f0f0; color:#777; } h2 { font-size:15px; letter-spacing:-.55px; margin:8px 0 9px; font-weight:600; } .debate-link { color:inherit; text-decoration:none; } .debate-link:hover { text-decoration:underline; } .opening, .empty { color:#888; font-size:12px; line-height:1.65; } .empty { padding:24px 18px; } .pagination { display:flex; justify-content:center; align-items:center; gap:4px; padding:22px 12px; background:#fff; border:1px solid var(--line); border-top:0; } .page-link, .page-gap { min-width:30px; height:30px; display:grid; place-items:center; color:#666; font-size:12px; text-decoration:none; } .page-link { border:1px solid transparent; border-radius:3px; } .page-link:hover { background:#f3f3f3; } .page-link.current { background:#333; color:#fff; font-weight:700; } .page-link.disabled { color:#bbb; pointer-events:none; }
      .mobile-nav { display:none; } @media (max-width:760px) { header { height:58px; padding:0 14px; gap:0; } .brand { font-size:19px; letter-spacing:-1.1px; } nav { margin-left:17px; gap:16px; } nav a { font-size:12px; line-height:1.15; white-space:nowrap; } .desktop-nav { display:none; } .mobile-nav { display:inline; } .start { display:none; } #auth-area { margin-left:auto; min-width:0; } #auth-area .account-link { max-width:62px; overflow:hidden; text-overflow:ellipsis; font-size:12px; font-weight:800; } #auth-area .logout-button { display:none; } .mobile-start { display:flex; position:fixed; right:18px; bottom:20px; z-index:4; align-items:center; gap:6px; background:#303030; color:#fff; text-decoration:none; border-radius:24px; padding:13px 17px; box-shadow:0 5px 16px rgba(0,0,0,.22); font-size:13px; font-weight:700; } main { width:calc(100% - 36px); margin-top:20px; } }
    </style>
  </head>
  <body>
    <header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a href="index.html#popular"><span class="desktop-nav">인기 토론</span><span class="mobile-nav">인기 토론</span></a><a class="active" href="index.html#categories">카테고리</a></nav><a class="start" href="login.html?next=create-debate.html">토론 시작하기</a><span id="auth-area"><a class="account-link" href="login.html">로그인</a></span></header>
    <main><a class="back" href="index.html#categories">← 카테고리로 돌아가기</a><section class="section"><h1 id="page-title">카테고리 토론 <span id="count"></span></h1><div id="debate-list"><div class="empty">토론을 불러오는 중입니다.</div></div></section><nav class="pagination" id="pagination" aria-label="목록 페이지"></nav></main>
    <a class="mobile-start" href="login.html?next=create-debate.html">＋ 토론 시작하기</a>
    <script type="module">
      import { supabase, mountAuthState } from './supabase.js';
      mountAuthState('auth-area');
      const categories = ['일상', '사회 · 정치', '연애', '문화 · 취미', '게임 · 스포츠', '학교 · 직장'];
      const params = new URLSearchParams(location.search);
      const name = params.get('name');
      const pageSize = 20;
      const page = Math.max(1, Number.parseInt(params.get('page'), 10) || 1);
      const list = document.getElementById('debate-list');
      const title = document.getElementById('page-title');
      const pagination = document.getElementById('pagination');
      function pageUrl(targetPage) { return `category.html?name=${encodeURIComponent(name)}&page=${targetPage}`; }
      function renderPagination(totalPages, currentPage) {
        if (totalPages <= 1) { pagination.hidden = true; return; }
        const pages = [...new Set([1, currentPage - 1, currentPage, currentPage + 1, totalPages])].filter(number => number >= 1 && number <= totalPages).sort((a, b) => a - b);
        const addLink = (label, targetPage, className = '') => { const link = document.createElement('a'); link.className = `page-link ${className}`; link.href = pageUrl(targetPage); link.textContent = label; pagination.append(link); };
        addLink('<<', Math.max(1, currentPage - 1), currentPage === 1 ? 'disabled' : '');
        pages.forEach((number, index) => { if (index && number - pages[index - 1] > 1) { const gap = document.createElement('span'); gap.className = 'page-gap'; gap.textContent = '…'; pagination.append(gap); } addLink(String(number), number, number === currentPage ? 'current' : ''); });
        addLink('>>', Math.min(totalPages, currentPage + 1), currentPage === totalPages ? 'disabled' : '');
      }
      if (!categories.includes(name)) { title.textContent = '카테고리를 찾을 수 없습니다.'; list.innerHTML = '<div class="empty">메인 화면에서 카테고리를 선택해 주세요.</div>'; pagination.hidden = true; }
      else {
        title.firstChild.textContent = `${name} `;
        const { data: debates, error } = await supabase.rpc('list_debates_page', { p_category:name, p_page:page, p_page_size:pageSize });
        if (error) list.innerHTML = '<div class="empty">토론 목록을 불러오지 못했습니다.</div>';
        else if (!debates?.length) list.innerHTML = `<div class="empty">${name} 카테고리에 아직 등록된 토론이 없습니다.</div>`;
        else {
          const totalCount = Number(debates[0]?.total_count || 0); const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
          document.getElementById('count').textContent = `${totalCount}개`;
          list.replaceChildren();
          debates.forEach(debate => {
            const article = document.createElement('article'); article.className = 'debate'; article.tabIndex = 0; article.setAttribute('role','link');
            const ended = new Date(debate.ends_at) <= new Date(); const remain = Math.max(0, new Date(debate.ends_at) - Date.now());
            const badge = document.createElement('span'); badge.className = `badge ${ended ? 'ended' : (debate.status === 'waiting' ? 'waiting' : 'live')}`; badge.textContent = ended ? '종료된 토론' : (debate.status === 'waiting' ? '상대 모집 중' : '진행 중');
            const meta = document.createElement('div'); meta.className='meta'; meta.append(badge, document.createTextNode(` ${ended ? '토론 종료' : `${Math.floor(remain / 3600000)}시간 ${Math.floor(remain % 3600000 / 60000)}분 남음`}`));
            const heading = document.createElement('h2'); const link = document.createElement('a'); link.className='debate-link'; link.href=`debate-detail.html?id=${debate.id}`; link.textContent=debate.title; heading.append(link);
            const openingMessage = debate.opening_preview || '첫 발언을 불러올 수 없습니다.';
            const opening = document.createElement('div'); opening.className='opening'; opening.textContent = openingMessage.length > 150 ? `${openingMessage.slice(0, 150)}…` : openingMessage;
            const destination=`debate-detail.html?id=${debate.id}`; article.addEventListener('click', event => { if (!event.target.closest('a')) location.href=destination; }); article.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); location.href=destination; } });
            article.append(meta,heading,opening); list.append(article);
          });
          renderPagination(totalPages, Math.min(page, totalPages));
        }
      }
    </script>
  </body>
</html>
