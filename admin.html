<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>관리자 신고 관리 — OnDebate</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><style>:root{--ink:#222;--line:#e5e5e5;--paper:#f6f6f6;--red:#d85a50}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 980px)/2));gap:42px}.brand{color:#222;text-decoration:none;font-size:22px;font-weight:700;letter-spacing:-1.3px}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px}nav a{color:#666;font-size:14px;text-decoration:none}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer}main{width:min(980px,calc(100% - 36px));margin:28px auto 70px}h1{margin:0 0 18px;font-size:22px}.section{background:#fff;border:1px solid var(--line)}.group-title{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font-size:14px}.group-title.done{margin-top:18px;border-top:1px solid var(--line);background:#fafafa;color:#666}.item{padding:17px 18px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.meta{color:#888;font-size:12px;margin-bottom:8px}.title{color:#222;text-decoration:none;font-size:15px;font-weight:700}.reason{margin:9px 0;color:#555;font-size:13px;line-height:1.6}.actions{display:flex;gap:7px}.actions button{border:1px solid #cfcfcf;background:#fff;padding:7px 10px;color:#555;font:12px "Noto Sans KR",sans-serif;cursor:pointer}.actions .hide{border-color:#a84940;color:#a84940}.actions .delete{border-color:#9b302a;background:#9b302a;color:#fff}.empty{margin:0;padding:20px;color:#888;font-size:13px}@media(max-width:650px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px}nav{margin-left:17px;gap:16px}nav a{font-size:12px}.start{display:none}#auth-area{margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 28px);margin-top:22px}}</style></head><body><header><a class="brand" href="index.html">On<i>Debate</i></a><nav><a href="index.html#popular">인기 토론</a><a href="index.html#categories">카테고리</a></nav><a class="start" href="create-debate.html">토론 시작하기</a><span id="auth-area"></span></header><main><h1>신고 관리</h1><section class="section" id="reports"><p class="empty">신고 목록을 불러오는 중입니다.</p></section></main><script type="module">import{supabase,mountAuthState}from'./supabase.js';const{data:{user}}=await supabase.auth.getUser();if(!user)location.href='login.html?next=admin.html';mountAuthState('auth-area');const list=document.getElementById('reports');const{data:reports,error}=await supabase.rpc('admin_reports');if(error){list.innerHTML='<p class="empty">관리자 권한이 없거나 신고 목록을 불러오지 못했습니다.</p>'}else if(!reports?.length){list.innerHTML='<p class="empty">접수된 신고가 없습니다.</p>'}else{list.replaceChildren();reports.slice().sort((a,b)=>Number(a.status!=='open')-Number(b.status!=='open')).forEach(report=>{if(report.status==='open'&&!list.querySelector('.pending-group')){const heading=document.createElement('h2');heading.className='group-title pending-group';heading.textContent='접수된 신고';list.append(heading)}if(report.status!=='open'&&!list.querySelector('.done-group')){const heading=document.createElement('h2');heading.className='group-title done done-group';heading.textContent='처리 완료';list.append(heading)}const item=document.createElement('article');item.className='item';const meta=document.createElement('div');meta.className='meta';meta.textContent=`${report.status==='open'?'검토 대기':report.status==='reviewed'?'처리 완료':'신고 기각'} · 신고자 ${report.reporter_nickname} · 대상 ${report.reported_nickname}`;const title=document.createElement('a');title.className='title';title.href=`debate-detail.html?id=${report.debate_id}`;title.textContent=report.title;const reason=document.createElement('p');reason.className='reason';reason.textContent=`신고 사유: ${report.reason}`;const actions=document.createElement('div');actions.className='actions';if(report.status==='open'){const hide=document.createElement('button');hide.className='hide';hide.textContent='게시물 숨김';hide.addEventListener('click',async()=>{if(!confirm('이 토론을 숨김 처리할까요?'))return;const{error}=await supabase.rpc('admin_hide_debate',{p_debate_id:report.debate_id,p_report_id:report.id});if(error){alert(error.message);return}location.reload()});const remove=document.createElement('button');remove.className='delete';remove.textContent='게시물 삭제';remove.addEventListener('click',async()=>{if(!confirm('토론과 모든 발언·댓글을 영구 삭제할까요?\n이 작업은 되돌릴 수 없습니다.'))return;const{error}=await supabase.rpc('admin_delete_debate',{p_debate_id:report.debate_id});if(error){alert(error.message);return}location.reload()});const restrict=document.createElement('button');restrict.textContent='익명 글쓰기 7일 제한';restrict.addEventListener('click',async()=>{if(!confirm('이 사용자의 익명 글쓰기를 7일간 제한할까요?\\n실명 공개나 계정 식별은 하지 않습니다.'))return;const{error}=await supabase.rpc('admin_restrict_anonymous_subject',{p_report_id:report.id,p_hours:168});if(error){alert(error.message);return}location.reload()});const dismiss=document.createElement('button');dismiss.textContent='신고 기각';dismiss.addEventListener('click',async()=>{const{error}=await supabase.rpc('admin_dismiss_report',{p_report_id:report.id});if(error){alert(error.message);return}location.reload()});actions.append(hide,remove,restrict,dismiss)}item.append(meta,title,reason,actions);list.append(item)})}</script></body></html>
