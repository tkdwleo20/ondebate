<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이메일 인증 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; } header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 980px)/2)); } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; } main { min-height:calc(100vh - 62px); display:grid; place-items:center; padding:30px 18px; } .card { width:min(400px,100%); background:#fff; border:1px solid var(--line); padding:30px; text-align:center; } h1 { margin:0 0 9px; font-size:21px; } p { margin:0 0 24px; color:#777; font-size:13px; line-height:1.65; } strong { color:#333; font-weight:700; word-break:break-all; } input { width:100%; height:50px; border:1px solid #d0d0d0; text-align:center; letter-spacing:7px; font:600 21px "Noto Sans KR",sans-serif; outline:none; } input:focus { border-color:#555; } button { width:100%; height:45px; margin-top:15px; border:0; background:#333; color:#fff; font:700 13px "Noto Sans KR",sans-serif; cursor:pointer; } button:disabled { background:#999; cursor:wait; } .message { display:none; margin-top:15px; padding:11px; text-align:left; font-size:12px; line-height:1.55; } .message.show { display:block; } .message.error { border:1px solid #efb9b0; background:#fff2f0; color:#b53e31; } .resend { margin-top:17px; border:0; background:none; color:#555; font-size:12px; text-decoration:underline; cursor:pointer; }
    </style>
  </head>
  <body>
    <header><a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i></a></header>
    <main><section class="card"><h1>이메일 인증</h1><p><strong id="email-label"></strong>으로 보낸<br />8자리 인증 코드를 입력해 주세요.</p><form id="verify-form"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" required placeholder="00000000" /><button type="submit">인증하고 가입 완료</button></form><div class="message" id="message"></div><button class="resend" id="resend" type="button">인증 코드 다시 보내기</button></section></main>
    <script type="module">
      import { supabase } from './supabase.js?v=brand-logo-4';
      const email = new URLSearchParams(location.search).get('email'); const message = document.getElementById('message'); const form = document.getElementById('verify-form');
      const next = new URLSearchParams(location.search).get('next') || 'index.html'; if (!email) location.href = 'signup.html'; document.getElementById('email-label').textContent = email || '';
      function showError(text) { message.textContent = text; message.className = 'message show error'; }
      form.addEventListener('submit', async event => { event.preventDefault(); const button = form.querySelector('button'); button.disabled = true; button.textContent = '확인 중…'; message.className = 'message'; const { error } = await supabase.auth.verifyOtp({ email, token: document.getElementById('code').value.trim(), type: 'signup' }); if (error) { showError('인증 코드를 다시 확인해 주세요.'); button.disabled = false; button.textContent = '인증하고 가입 완료'; return; } location.href = `nickname.html?next=${encodeURIComponent(next)}`; });
      document.getElementById('resend').addEventListener('click', async event => { const button = event.currentTarget; button.disabled = true; button.textContent = '보내는 중…'; const { error } = await supabase.auth.resend({ type:'signup', email }); if (error) showError(error.message); else { message.textContent = '새 인증 코드를 보냈습니다.'; message.className = 'message show'; } button.disabled = false; button.textContent = '인증 코드 다시 보내기'; });
    </script>
    <script src="footer.js"></script>
  </body>
</html>
