<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>닉네임 설정 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; } header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 980px)/2)); } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; } main { min-height:calc(100vh - 62px); display:grid; place-items:center; padding:28px 18px; } .card { width:min(420px,100%); background:#fff; border:1px solid var(--line); padding:30px; } h1 { font-size:21px; letter-spacing:-.8px; margin:0 0 8px; } p { margin:0 0 23px; color:#777; font-size:13px; line-height:1.65; } label { display:block; margin-bottom:8px; font-size:13px; font-weight:700; } input { width:100%; height:43px; border:1px solid #d5d5d5; padding:0 10px; font:14px "Noto Sans KR",sans-serif; outline:0; } input:focus { border-color:#555; } button { width:100%; height:43px; margin-top:10px; border:0; background:#333; color:#fff; font:600 13px "Noto Sans KR",sans-serif; cursor:pointer; } .message { display:none; margin-top:13px; font-size:12px; color:#c1493c; } .message.show { display:block; }
    </style>
  </head>
  <body>
    <header><a class="brand" href="index.html">On<i>Debate</i></a></header>
    <main><section class="card"><h1>닉네임을 정해주세요</h1><p>토론과 댓글에서 사용할 이름입니다. 나중에 변경할 수 있습니다.</p><form id="nickname-form"><label for="nickname">닉네임</label><input id="nickname" minlength="2" maxlength="20" required placeholder="2~20자로 입력" autofocus /><button type="submit">시작하기</button><div class="message" id="message"></div></form></section></main>
    <script type="module">
      import { supabase, getProfile, saveNickname } from './supabase.js';
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) location.href = 'login.html';
      const profile = await getProfile();
      if (profile && !/^토론자[0-9a-f]{6}$/i.test(profile.nickname)) document.getElementById('nickname').value = profile.nickname;
      document.getElementById('nickname-form').addEventListener('submit', async event => {
        event.preventDefault(); const message = document.getElementById('message');
        try { await saveNickname(document.getElementById('nickname').value); location.href = new URLSearchParams(location.search).get('next') || 'index.html'; }
        catch (error) { message.textContent = error.message === 'duplicate key value violates unique constraint "profiles_nickname_key"' ? '이미 사용 중인 닉네임입니다.' : error.message; message.classList.add('show'); }
      });
    </script>
  </body>
</html>
