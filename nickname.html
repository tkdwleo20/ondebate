<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>닉네임 설정 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; } header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 980px)/2)); } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; } main { min-height:calc(100vh - 62px); display:grid; place-items:center; padding:28px 18px; } .card { width:min(420px,100%); background:#fff; border:1px solid var(--line); padding:30px; } h1 { font-size:21px; letter-spacing:-.8px; margin:0 0 8px; } p { margin:0 0 23px; color:#777; font-size:13px; line-height:1.65; } label { display:block; margin-bottom:8px; font-size:13px; font-weight:700; } .nickname-row { display:flex; gap:7px; } input { min-width:0; flex:1; height:43px; border:1px solid #d5d5d5; padding:0 10px; font:14px "Noto Sans KR",sans-serif; outline:0; } input:focus { border-color:#555; } .agreements { display:grid; gap:8px; margin-top:17px; padding-top:15px; border-top:1px solid #eee; } .agreements label { display:flex; align-items:center; gap:7px; margin:0; color:#555; font-size:12px; font-weight:500; line-height:1.45; } .agreements input { width:15px; height:15px; min-width:15px; margin:0; padding:0; accent-color:#333; } .agreements a { color:#333; text-decoration:underline; } button { height:43px; margin-top:10px; border:0; background:#333; color:#fff; font:600 13px "Noto Sans KR",sans-serif; cursor:pointer; } .check-button { width:95px; flex:none; margin-top:0; background:#fff; border:1px solid #555; color:#444; } .submit-button { width:100%; } button:disabled { opacity:.55; cursor:wait; } .message { display:none; margin-top:13px; font-size:12px; color:#c1493c; } .message.success { color:#37733d; } .message.show { display:block; }
    </style>
  </head>
  <body>
    <header><a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i></a></header>
    <main><section class="card"><h1 id="page-title">닉네임을 정해주세요</h1><p id="page-description">토론과 댓글에서 사용할 이름입니다.</p><form id="nickname-form"><label for="nickname">닉네임</label><div class="nickname-row"><input id="nickname" minlength="2" maxlength="20" required placeholder="2~20자로 입력" autofocus /><button class="check-button" id="check-nickname" type="button">중복 확인</button></div><div class="agreements" id="agreement-group"><label><input id="terms-agree" type="checkbox" /> <a href="terms.html" target="_blank">이용약관</a>에 동의합니다. (필수)</label><label><input id="privacy-agree" type="checkbox" /> <a href="privacy.html" target="_blank">개인정보처리방침</a>에 동의합니다. (필수)</label></div><button class="submit-button" id="submit-button" type="submit">시작하기</button><div class="message" id="message"></div></form></section></main>
    <script type="module">
      import { supabase, getProfile, saveNickname, changeNickname } from './supabase.js?v=welcome-notification-1';
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) location.href = 'login.html';
      const profile = await getProfile();
      const params = new URLSearchParams(location.search); const isChange = params.get('mode') === 'change';
      if (isChange && !profile) location.href = 'nickname.html';
      const needsTermsConsent = !isChange && !user.user_metadata?.terms_accepted_at;
      if (!needsTermsConsent) document.getElementById('agreement-group').hidden = true;
      if (isChange) { document.title = '닉네임 변경 — OnDebate'; document.getElementById('page-title').textContent = '닉네임 변경'; document.getElementById('page-description').textContent = '최초 1회는 언제든 변경할 수 있고, 이후에는 마지막 변경일로부터 3개월 후에 변경할 수 있습니다.'; document.getElementById('submit-button').textContent = '닉네임 변경하기'; }
      if (profile && (!/^토론자[0-9a-f]{6}$/i.test(profile.nickname) || isChange)) document.getElementById('nickname').value = profile.nickname;
      const input = document.getElementById('nickname'); const message = document.getElementById('message'); let checkedNickname = null;
      input.addEventListener('input', () => { checkedNickname = null; message.classList.remove('show', 'success'); });
      document.getElementById('check-nickname').addEventListener('click', async () => {
        const nickname = input.value.trim(); message.classList.remove('success');
        if (nickname.length < 2 || nickname.length > 20) { message.textContent = '닉네임은 2~20자로 입력해 주세요.'; message.classList.add('show'); return; }
        const button = document.getElementById('check-nickname'); button.disabled = true; button.textContent = '확인 중…';
        const { data, error } = await supabase.rpc('is_nickname_available', { p_nickname:nickname });
        button.disabled = false; button.textContent = '중복 확인';
        if (error) { message.textContent = '중복 확인을 하지 못했습니다. 다시 시도해 주세요.'; message.classList.add('show'); return; }
        if (!data) { checkedNickname = null; message.textContent = '이미 사용 중인 닉네임입니다.'; message.classList.add('show'); return; }
        checkedNickname = nickname.toLocaleLowerCase('ko-KR'); message.textContent = '사용 가능한 닉네임입니다.'; message.classList.add('show', 'success');
      });
      document.getElementById('nickname-form').addEventListener('submit', async event => {
        event.preventDefault(); const nickname = input.value.trim();
        if (checkedNickname !== nickname.toLocaleLowerCase('ko-KR')) { message.textContent = '닉네임 중복 확인을 먼저 해주세요.'; message.classList.remove('success'); message.classList.add('show'); return; }
        if (needsTermsConsent && (!document.getElementById('terms-agree').checked || !document.getElementById('privacy-agree').checked)) { message.textContent = '이용약관과 개인정보처리방침에 모두 동의해 주세요.'; message.classList.remove('success'); message.classList.add('show'); return; }
        try { if (needsTermsConsent) { const acceptedAt = new Date().toISOString(); const { error } = await supabase.auth.updateUser({ data:{ terms_accepted_at:acceptedAt, privacy_accepted_at:acceptedAt } }); if (error) throw error; } if (isChange) await changeNickname(nickname); else await saveNickname(nickname); location.href = params.get('next') || 'index.html'; }
        catch (error) { message.textContent = error.code === '23505' ? '이미 사용 중인 닉네임입니다.' : error.message; message.classList.remove('success'); message.classList.add('show'); }
      });
    </script>
    <script src="footer.js"></script>
  </body>
</html>
