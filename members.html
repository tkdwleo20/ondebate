<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원 관리 — OnDebate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>:root{--ink:#222;--line:#e5e5e5;--paper:#f6f6f6;--red:#d85a50}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 980px)/2));gap:42px}.brand{color:#222;text-decoration:none;font-size:22px;font-weight:700;letter-spacing:-1.3px}.brand i{color:var(--red);font-style:normal}nav{display:flex;gap:26px}nav a{color:#666;font-size:14px;text-decoration:none}.start{margin-left:auto;background:#3b3b3b;color:#fff;text-decoration:none;border-radius:3px;padding:9px 14px;font-size:13px;font-weight:600}#auth-area{display:flex;align-items:center;gap:10px}.account-link{color:#333;text-decoration:none;font-size:13px;font-weight:600}.logout-button{border:0;background:transparent;color:#888;font:13px "Noto Sans KR",sans-serif;cursor:pointer}main{width:min(980px,calc(100% - 36px));margin:28px auto 70px}h1{margin:0 0 18px;font-size:22px}.section{background:#fff;border:1px solid var(--line)}.member{padding:16px 18px;border-bottom:1px solid var(--line)}.member:last-child{border:0}.name{font-size:15px;font-weight:700}.summary{margin-top:6px;color:#777;font-size:12px}.summary b{color:#9b433b}.activity-button{margin-top:10px;border:0;background:none;padding:0;color:#666;font:12px "Noto Sans KR",sans-serif;cursor:pointer}.activity{margin-top:10px;border-top:1px solid #eee;padding-top:8px}.activity[hidden]{display:none}.activity-item{padding:7px 0;font-size:12px;line-height:1.55}.activity-item b{display:inline-block;min-width:64px;color:#9b433b}.activity-item a{color:#444;text-decoration:none}.empty{margin:0;padding:20px;color:#888;font-size:13px}@media(max-width:650px){header{height:58px;padding:0 14px;gap:0}.brand{font-size:19px}nav{margin-left:17px;gap:16px}nav a{font-size:12px}.start{display:none}#auth-area{margin-left:auto;min-width:0}#auth-area .account-link{max-width:62px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}#auth-area .logout-button{display:none}main{width:calc(100% - 28px);margin-top:22px}}</style>
</head>
<body>
<header>
<a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i>
</a>
<nav>
<a href="index.html#popular">인기 토론</a>
<a href="index.html#categories">카테고리</a>
</nav>
<a class="start" href="create-debate.html">토론 시작하기</a>
<span id="auth-area">
</span>
</header>
<main>
<h1>회원 관리</h1>
<section class="section" id="members">
<p class="empty">회원 목록을 불러오는 중입니다.</p>
</section>
</main>
<script type="module">import{supabase,mountAuthState}from'./supabase.js?v=welcome-notification-1';const{data:{user}}=await supabase.auth.getUser();if(!user)location.href='login.html?next=members.html';mountAuthState('auth-area');const list=document.getElementById('members');const{data:members,error}=await supabase.rpc('admin_members');if(error){list.innerHTML='<p class="empty">관리자 권한이 없거나 회원 목록을 불러오지 못했습니다.</p>'}else if(!members?.length){list.innerHTML='<p class="empty">등록된 회원이 없습니다.</p>'}else{list.replaceChildren();members.forEach(member=>{const row=document.createElement('article');row.className='member';const name=document.createElement('div');name.className='name';name.textContent=member.nickname;const summary=document.createElement('div');summary.className='summary';summary.innerHTML=`토론 ${member.debates_count} · 댓글 ${member.comments_count} · <b>신고 ${member.reports_received}</b>`;const button=document.createElement('button');button.className='activity-button';button.type='button';button.textContent='활동 내역 보기';const activity=document.createElement('div');activity.className='activity';activity.hidden=true;button.addEventListener('click',async()=>{if(!activity.hidden){activity.hidden=true;button.textContent='활동 내역 보기';return}activity.hidden=false;button.textContent='활동 내역 닫기';if(activity.childElementCount)return;activity.textContent='불러오는 중…';const{data,error}=await supabase.rpc('admin_member_activity',{p_user_id:member.user_id});if(error){activity.textContent='활동 내역을 불러오지 못했습니다.';return}activity.replaceChildren();if(!data?.length){activity.textContent='표시할 활동 내역이 없습니다.';return}data.forEach(item=>{const line=document.createElement('div');line.className='activity-item';const type=document.createElement('b');type.textContent=item.activity_type;const link=document.createElement('a');link.href=`debate-detail.html?id=${item.debate_id}`;link.textContent=`${item.debate_title} — ${item.body.length>80?item.body.slice(0,80)+'…':item.body}`;line.append(type,link);activity.append(line)})});row.append(name,summary,button,activity);list.append(row)})}</script>

<script>const removeAnonymousAdminActivity=()=>document.querySelectorAll('.activity-item a[href$="id=null"]').forEach(link=>link.closest('.activity-item')?.remove());new MutationObserver(removeAnonymousAdminActivity).observe(document.getElementById('members'),{childList:true,subtree:true});removeAnonymousAdminActivity();</script>
</body>
</html>
