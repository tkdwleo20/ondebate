<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이메일 회원가입 — OnDebate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#222; --line:#e3e3e3; --paper:#f6f6f6; --red:#d85a50; } * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",sans-serif; } header { height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 max(28px,calc((100vw - 980px)/2)); } .brand { color:#222; text-decoration:none; font-size:22px; font-weight:700; letter-spacing:-1.3px; } .brand i { color:var(--red); font-style:normal; } main { min-height:calc(100vh - 62px); display:grid; place-items:center; padding:30px 18px; } .card { width:min(400px,100%); background:#fff; border:1px solid var(--line); padding:30px; } h1 { margin:0 0 8px; text-align:center; font-size:21px; } .intro { margin:0 0 24px; text-align:center; color:#777; font-size:13px; line-height:1.65; } label { display:block; margin:13px 0 6px; font-size:12px; font-weight:700; } input { width:100%; height:44px; border:1px solid #d7d7d7; padding:0 10px; font:13px "Noto Sans KR",sans-serif; } .hint { margin:7px 0 0; color:#888; font-size:11px; line-height:1.55; } .agreements { display:grid; gap:8px; margin-top:18px; padding-top:15px; border-top:1px solid #eee; } .agreements label { display:flex; align-items:center; gap:7px; margin:0; color:#555; font-weight:500; line-height:1.45; } .agreements input { width:15px; height:15px; margin:0; padding:0; accent-color:#333; flex:none; } .agreements a { color:#333; text-decoration:underline; } button { width:100%; height:45px; margin-top:19px; border:0; background:#333; color:#fff; font:700 13px "Noto Sans KR",sans-serif; cursor:pointer; } button:disabled { background:#999; cursor:wait; } .message { display:none; margin-top:15px; padding:11px; font-size:12px; line-height:1.55; } .message.show { display:block; } .message.error { border:1px solid #efb9b0; background:#fff2f0; color:#b53e31; } .message.success { border:1px solid #cbe2cc; background:#eef7ee; color:#39623c; } .back { display:block; margin-top:18px; text-align:center; color:#666; font-size:12px; } .back a { color:#333; font-weight:700; }
    </style>
  </head>
  <body>
    <header><a class="brand" style="visibility:hidden" href="index.html">On<i>Debate</i></a></header>
    <main><section class="card"><h1>이메일로 회원가입</h1><p class="intro">인증 코드를 이메일로 보내드립니다.</p><form id="signup-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com" /><label for="password">비밀번호</label><input id="password" type="password" autocomplete="new-password" required minlength="8" placeholder="8자 이상 입력" /><p class="hint">영문, 숫자, 특수문자를 섞어 안전하게 만들어 주세요.</p><label for="password-confirm">비밀번호 확인</label><input id="password-confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="비밀번호 다시 입력" /><div class="agreements"><label><input id="terms-agree" type="checkbox" required /> <a href="terms.html" target="_blank">이용약관</a>에 동의합니다. (필수)</label><label><input id="privacy-agree" type="checkbox" required /> <a href="privacy.html" target="_blank">개인정보처리방침</a>에 동의합니다. (필수)</label></div><button type="submit">인증 코드 보내기</button></form><div class="message" id="message"></div><span class="back">이미 계정이 있나요? <a href="login.html">로그인</a></span></section></main>
    <script type="module">
      import { supabase } from './supabase.js?v=notification-titles-1';
      const form = document.getElementById('signup-form'); const message = document.getElementById('message');
      form.addEventListener('submit', async event => {
        event.preventDefault(); const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value; const confirm = document.getElementById('password-confirm').value; const button = form.querySelector('button');
        if (password !== confirm) { message.textContent = '비밀번호가 서로 다릅니다.'; message.className = 'message show error'; return; }
        if (!document.getElementById('terms-agree').checked || !document.getElementById('privacy-agree').checked) { message.textContent = '이용약관과 개인정보처리방침에 모두 동의해 주세요.'; message.className = 'message show error'; return; }
        button.disabled = true; button.textContent = '보내는 중…'; message.className = 'message';
        const next = new URLSearchParams(location.search).get('next') || 'index.html'; const consentedAt = new Date().toISOString(); const { error } = await supabase.auth.signUp({ email, password, options:{ data:{ terms_accepted_at:consentedAt, privacy_accepted_at:consentedAt } } });
        if (error) { message.textContent = error.message; message.className = 'message show error'; button.disabled = false; button.textContent = '인증 코드 보내기'; return; }
        location.href = `verify-email.html?email=${encodeURIComponent(email)}&next=${encodeURIComponent(next)}`;
      });
    </script>
    <script src="footer.js"></script>
  </body>
</html>
